<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ПОРОВНУ — Разделение общих расходов</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <!-- Official Telegram WebApp SDK & Supabase JS v2 -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================================================
       1. EDITORIAL FINTECH DESIGN TOKENS (LIGHT & DARK THEMES)
       ========================================================================== */
    :root {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --surface-muted: #EEF1F5;
      --border: rgba(17, 24, 39, 0.08);
      --border-strong: rgba(17, 24, 39, 0.16);

      --text-primary: #111827;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;

      --cta-bg: #111827;
      --cta-bg-hover: #1F2937;
      --cta-text: #FFFFFF;

      --accent-blue: #0F62FE;
      --accent-blue-soft: rgba(15, 98, 254, 0.09);

      --emerald: #16A34A;
      --emerald-soft: #ECFDF5;
      --emerald-border: rgba(22, 163, 74, 0.24);

      --crimson: #DC2626;
      --crimson-soft: #FEF2F2;
      --crimson-border: rgba(220, 38, 38, 0.22);

      --amber: #D97706;
      --amber-soft: #FFFBEB;
      --amber-border: rgba(217, 119, 6, 0.26);

      --backdrop: rgba(17, 24, 39, 0.48);
      --shadow-xs: 0 1px 2px rgba(17, 24, 39, 0.04);
      --shadow-sheet: 0 -12px 36px rgba(17, 24, 39, 0.14);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    [data-theme="dark"] {
      --bg: #0D1117;
      --surface: #161B22;
      --surface-subtle: #1C2129;
      --surface-muted: #242A35;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);

      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-tertiary: #64748B;

      --cta-bg: #F8FAFC;
      --cta-bg-hover: #E2E8F0;
      --cta-text: #0D1117;

      --accent-blue: #3B82F6;
      --accent-blue-soft: rgba(59, 130, 246, 0.14);

      --emerald: #22C55E;
      --emerald-soft: rgba(34, 197, 94, 0.12);
      --emerald-border: rgba(34, 197, 94, 0.28);

      --crimson: #F87171;
      --crimson-soft: rgba(248, 113, 113, 0.12);
      --crimson-border: rgba(248, 113, 113, 0.28);

      --amber: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --amber-border: rgba(251, 191, 36, 0.28);

      --backdrop: rgba(4, 6, 10, 0.76);
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.24);
      --shadow-sheet: 0 -12px 36px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       2. BASE RESET & APP FRAME (FULL-BLEED IN TMA, CENTERED FRAME ON DESKTOP)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .viewport-wrapper {
      height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: var(--bg);
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      .app-shell.desktop-frame {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }

    /* ==========================================================================
       3. TOP NAVIGATION BAR & BRAND MARK
       ========================================================================== */
    .topbar {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--cta-bg);
      color: var(--cta-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-wordmark {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .sync-dot.connecting {
      background: var(--amber);
      opacity: 0.75;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      max-width: 165px;
      transition: border-color 0.15s;
    }

    .user-chip:hover {
      border-color: var(--border-strong);
    }

    .user-chip-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .icon-btn.danger:hover {
      border-color: var(--crimson-border);
      background: var(--crimson-soft);
      color: var(--crimson);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px 0 6px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      transition: border-color 0.15s, background 0.15s;
    }

    .back-link:hover {
      border-color: var(--border-strong);
    }

    /* ==========================================================================
       4. MAIN SCROLL AREA, CARDS, BUTTONS, SEGMENTED CONTROLS
       ========================================================================== */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 32px;
      scroll-behavior: smooth;
    }

    .scroll-area.with-bottom-cta {
      padding-bottom: 88px;
    }

    .scroll-area::-webkit-scrollbar {
      width: 4px;
    }

    .scroll-area::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 99px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-xs);
      margin-bottom: 12px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 2px 10px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .section-meta {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--cta-bg);
      color: var(--cta-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--cta-bg-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-subtle);
    }

    .btn-emerald {
      background: var(--emerald);
      color: #FFFFFF;
    }

    .btn-emerald-soft {
      background: var(--emerald-soft);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
    }

    .btn-crimson-soft {
      background: var(--crimson-soft);
      color: var(--crimson);
      border: 1px solid var(--crimson-border);
    }

    .btn-sm {
      height: 34px;
      padding: 0 12px;
      font-size: 12.5px;
      border-radius: var(--radius-sm);
    }

    .btn-xs {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-block {
      width: 100%;
    }

    /* Segmented Tabs */
    .segmented {
      display: grid;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .segmented.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .segmented.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .seg-tab {
      height: 34px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .seg-tab.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .tab-pill-count {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--crimson-soft);
      color: var(--crimson);
    }

    /* ==========================================================================
       5. HOME SCREEN: "МОИ СОБЫТИЯ"
       ========================================================================== */
    .home-header-block {
      margin-bottom: 14px;
    }

    .home-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0 0 4px;
    }

    .home-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    .event-list-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-list-card:hover {
      border-color: var(--border-strong);
    }

    .event-list-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .cat-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .event-list-main {
      flex: 1;
      min-width: 0;
    }

    .event-list-title {
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.3;
      word-break: break-word;
    }

    .event-list-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .event-list-right {
      text-align: right;
      flex-shrink: 0;
    }

    .event-list-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 5px;
    }

    .status-tag.active {
      background: var(--surface-muted);
      color: var(--text-primary);
    }

    .status-tag.closed {
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    .event-list-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent 0%, var(--bg) 28%);
      z-index: 15;
    }

    /* ==========================================================================
       6. EVENT DETAIL SCREEN: HERO, PARTICIPANTS LINE & ORGANIZER BAR
       ========================================================================== */
    .event-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-xs);
    }

    .event-hero-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .event-hero-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0;
      color: var(--text-primary);
      word-break: break-word;
    }

    .event-hero-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .participants-inline-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-secondary);
    }

    .participants-inline-label {
      font-weight: 600;
      color: var(--text-primary);
    }

    .participants-inline-me {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Organizer-Only Inspection Strip */
    .organizer-inspect-bar {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-strong);
    }

    .organizer-inspect-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .organizer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cta-bg);
      display: inline-block;
    }

    .inspect-pills-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .inspect-pills-row::-webkit-scrollbar {
      display: none;
    }

    .inspect-pill {
      height: 30px;
      padding: 0 11px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .inspect-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .inspect-pill.active {
      background: var(--cta-bg);
      border-color: var(--cta-bg);
      color: var(--cta-text);
    }

    /* Banner when Organizer is inspecting another participant */
    .inspecting-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .inspecting-banner strong {
      font-weight: 700;
    }

    /* ==========================================================================
       7. TAB 1: "ТРАТЫ" (KPI STRIP & EXPENSE LIST)
       ========================================================================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-value.pos { color: var(--emerald); }
    .kpi-value.neg { color: var(--crimson); }

    .expense-item {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .expense-item:hover {
      border-color: var(--border-strong);
    }

    .expense-left {
      min-width: 0;
      flex: 1;
    }

    .expense-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .expense-sub-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .split-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-muted);
      color: var(--text-secondary);
    }

    .expense-right {
      text-align: right;
      flex-shrink: 0;
    }

    .expense-sum {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .expense-share-note {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* ==========================================================================
       8. TAB 2: "РАСЧЁТ" (SETTLEMENT & TRANSFERS)
       ========================================================================== */
    .settlement-hero-card {
      border: 1px solid var(--border-strong);
    }

    .settlement-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .settlement-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .personal-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .personal-metric-cell {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      min-width: 0;
    }

    .personal-metric-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .personal-metric-val {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .personal-metric-val.pos { color: var(--emerald); }
    .personal-metric-val.neg { color: var(--crimson); }

    .settlement-sub-group-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin: 12px 0 8px;
    }

    .transfer-row-box {

      /* ------------------------------------------------------------------------
         4. INTEGER-KOPEK FINANCIAL ENGINE & GREEDY DEBT MINIMIZATION
         ------------------------------------------------------------------------ */
      function toKopecks(val) {
        const cleaned = String(val ?? '').trim().replace(',', '.');
        if (cleaned === '') return 0;
        const num = parseFloat(cleaned);
        if (!Number.isFinite(num) || num < 0) return NaN;
        return Math.round(num * 100);
      }

      function fromKopecksInput(kop) {
        if (!kop || kop <= 0) return '';
        if (kop % 100 === 0) return String(kop / 100);
        return (kop / 100).toFixed(2).replace(/0$/, '');
      }

      function formatRubles(kop, withSign = false) {
        const isNeg = kop < 0;
        const abs = Math.abs(Math.round(kop));
        const rub = Math.floor(abs / 100);
        const cents = abs % 100;
        const rubFormatted = rub.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const str = cents === 0
          ? `${rubFormatted} ₽`
          : `${rubFormatted},${cents.toString().padStart(2, '0')} ₽`;

        if (withSign) {
          if (kop > 0) return `+${str}`;
          if (kop < 0) return `−${str}`;
        } else if (isNeg) {
          return `−${str}`;
        }
        return str;
      }

      function computeEventFinances(ev) {
        const participants = ev.participants || [];
        const expenses = ev.expenses || [];
        const paidRows = ev.paid_transfers || [];

        const totalBudgetKop = expenses.reduce(
          (acc, e) => acc + Math.round(Number(e.amount || 0) * 100),
          0
        );

        const ledger = {};
        participants.forEach(p => {
          ledger[p.id] = {
            participant: p,
            paidKop: 0,
            shareKop: 0,
            netKop: 0
          };
        });

        expenses.forEach(exp => {
          const amountKop = Math.round(Number(exp.amount || 0) * 100);
          if (amountKop <= 0) return;

          if (ledger[exp.paid_by]) {
            ledger[exp.paid_by].paidKop += amountKop;
          }

          const splits = exp.splits && typeof exp.splits === 'object' ? exp.splits : {};
          const validEntries = Object.entries(splits).filter(([pid]) => Boolean(ledger[pid]));

          if (validEntries.length > 0) {
            validEntries.forEach(([pid, rub]) => {
              const share = Math.round(Number(rub || 0) * 100);
              if (share > 0) ledger[pid].shareKop += share;
            });
          } else if (participants.length > 0) {
            const base = Math.floor(amountKop / participants.length);
            let rem = amountKop - base * participants.length;
            participants.forEach(p => {
              const extra = rem > 0 ? 1 : 0;
              if (rem > 0) rem--;
              ledger[p.id].shareKop += base + extra;
            });
          }
        });

        const balances = participants.map(p => {
          const item = ledger[p.id];
          item.netKop = item.paidKop - item.shareKop;
          return item;
        });

        const debtors = balances
          .filter(b => b.netKop < 0)
          .map(b => ({ id: b.participant.id, amount: Math.abs(b.netKop) }));

        const creditors = balances
          .filter(b => b.netKop > 0)
          .map(b => ({ id: b.participant.id, amount: b.netKop }));

        const rawTransfers = [];

        // Step 1: Exact 1-to-1 settlement matches
        for (let i = 0; i < debtors.length; i++) {
          if (debtors[i].amount === 0) continue;
          const matchIdx = creditors.findIndex(c => c.amount === debtors[i].amount);
          if (matchIdx !== -1) {
            const amt = debtors[i].amount;
            rawTransfers.push({
              fromId: debtors[i].id,
              toId: creditors[matchIdx].id,
              amountKop: amt
            });
            debtors[i].amount = 0;
            creditors[matchIdx].amount = 0;
          }
        }

        // Step 2: Greedy pairing (largest debtor -> largest creditor)
        while (true) {
          debtors.sort((a, b) => b.amount - a.amount);
          creditors.sort((a, b) => b.amount - a.amount);
          const topD = debtors[0];
          const topC = creditors[0];
          if (!topD || !topC || topD.amount <= 0 || topC.amount <= 0) break;

          const settled = Math.min(topD.amount, topC.amount);
          rawTransfers.push({
            fromId: topD.id,
            toId: topC.id,
            amountKop: settled
          });
          topD.amount -= settled;
          topC.amount -= settled;
        }

        const matchedRowIds = new Set();
        const transfers = rawTransfers.map((tr, index) => {
          const found = paidRows.find(row =>
            !matchedRowIds.has(row.id) &&
            row.from_participant_id === tr.fromId &&
            row.to_participant_id === tr.toId &&
            Math.round(Number(row.amount || 0) * 100) === tr.amountKop
          );
          if (found) matchedRowIds.add(found.id);

          return {
            ...tr,
            index,
            paidRow: found || null,
            isPaid: Boolean(found)
          };
        });

        const paidCount = transfers.filter(t => t.isPaid).length;
        const totalTransferKop = transfers.reduce((s, t) => s + t.amountKop, 0);
        const paidTransferKop = transfers.filter(t => t.isPaid).reduce((s, t) => s + t.amountKop, 0);
        const isClosed = totalBudgetKop > 0 && (transfers.length === 0 || paidCount === transfers.length);

        return {
          participants,
          totalBudgetKop,
          ledger,
          balances,
          transfers,
          paidCount,
          totalTransferKop,
          paidTransferKop,
          isClosed
        };
      }

      /* ------------------------------------------------------------------------
         5. ROLE & ORGANIZER RESOLUTION

      function resolveEventContext(ev) {
        const participants = ev.participants || [];
        const currentTgId = state.user.id;

        const myParticipant = participants.find(
          p => p.tg_user_id !== null && String(p.tg_user_id) === String(currentTgId)

        const isOrganizer = Boolean(
          (ev.creator_tg_id && currentTgId && String(ev.creator_tg_id) === String(currentTgId)) ||
          (myParticipant && myParticipant.is_organizer === true)
        );

        let effectiveViewingId = myParticipant ? myParticipant.id : (participants[0] ? participants[0].id : null);

        if (isOrganizer && state.viewingParticipantId && participants.some(p => p.id === state.viewingParticipantId)) {
          effectiveViewingId = state.viewingParticipantId;
        } else {
          state.viewingParticipantId = effectiveViewingId;
        }

        const viewedParticipant = participants.find(p => p.id === effectiveViewingId) || null;
        const isInspectingOther = Boolean(
          isOrganizer &&
          myParticipant &&
          viewedParticipant &&
          viewedParticipant.id !== myParticipant.id
        );

        return {
          myParticipant,
          isOrganizer,
          viewedParticipant,
          isInspectingOther
        };
      }

      function groupByEvent(rows) {
        const map = {};

          if (!map[r.event_id]) map[r.event_id] = [];

          (creatorRes.data || []).forEach(r => idSet.add(String(r.id)));

          const ids = Array.from(idSet);

          if (evRes.error) throw evRes.error;

          const partsMap = groupByEvent(partRes.data || []);
          const expsMap = groupByEvent(expRes.data || []);
          const paidMap = groupByEvent(paidRes.data || []);

          state.events = (evRes.data || []).map(ev => ({
            ...ev,
            participants: partsMap[ev.id] || [],
            expenses: expsMap[ev.id] || [],
            paid_transfers: paidMap[ev.id] || []

      async function openEventById(eventId, silent = false, autoJoin = true) {
        if (!silent) {
          state.loading = true;
          render();
        }

        try {
          const [evRes, partRes, expRes, paidRes] = await Promise.all([
            supabase.from('events').select('*').eq('id', eventId).maybeSingle(),
            supabase.from('participants').select('*').eq('event_id', eventId).order('created_at', { ascending: true }),
            supabase.from('expenses').select('*').eq('event_id', eventId).order('created_at', { ascending: true }),
            supabase.from('paid_transfers').select('*').eq('event_id', eventId).order('created_at', { ascending: true })
          ]);

          if (evRes.error) throw evRes.error;

          if (!evRes.data) {
            forgetEventId(eventId);
            state.screen = 'home';
            state.activeEventId = null;
            state.activeEvent = null;
            showToast('Событие не найдено или удалено');
            await fetchHomeEvents(false);
            return;
          }

          let participants = partRes.data || [];
          const currentTgId = state.user.id;

          // Auto-claim matching unlinked slot or auto-join event
          if (autoJoin && currentTgId) {
            const alreadyLinked = participants.some(
              p => p.tg_user_id !== null && String(p.tg_user_id) === String(currentTgId)
            );

            if (!alreadyLinked) {
              const normFull = state.user.fullName.trim().toLowerCase();
              const normFirst = state.user.firstName.trim().toLowerCase();

              const matchingSlot = participants.find(p => {
                if (p.tg_user_id !== null) return false;
                const pName = String(p.name || '').trim().toLowerCase();
                return pName === normFull || pName === normFirst;
              });

              if (matchingSlot) {
                const { error: claimErr } = await supabase
                  .from('participants')
                  .update({ tg_user_id: currentTgId })
                  .eq('id', matchingSlot.id);

                if (!claimErr) {
                  const reloaded = await supabase
                    .from('participants')
                    .select('*')
                    .eq('event_id', eventId)
                    .order('created_at', { ascending: true });
                  if (reloaded.data) participants = reloaded.data;
                }
              } else {
                const isCreator = evRes.data.creator_tg_id && String(evRes.data.creator_tg_id) === String(currentTgId);
                const { error: insertErr } = await supabase
                  .from('participants')
                  .insert({
                    event_id: eventId,
                    tg_user_id: currentTgId,
                    name: state.user.fullName,
                    phone: '',
                    bank: '',
                    is_organizer: Boolean(isCreator)
                  });

                if (!insertErr) {
                  const reloaded = await supabase
                    .from('participants')
                    .select('*')
                    .eq('event_id', eventId)
                    .order('created_at', { ascending: true });
                  if (reloaded.data) participants = reloaded.data;
                  showToast('Вы присоединились к событию');
                }
              }
            }
          }

          rememberEventId(eventId);

          const fullEvent = {
            ...evRes.data,
            participants,
            expenses: expRes.data || [],
            paid_transfers: paidRes.data || []
          };

          state.activeEventId = fullEvent.id;
          state.activeEvent = fullEvent;
          state.screen = 'event';

          // Set default viewingParticipantId to current user's participant record
          const me = participants.find(p => p.tg_user_id !== null && String(p.tg_user_id) === String(currentTgId));
          if (!silent || !state.viewingParticipantId || !participants.some(p => p.id === state.viewingParticipantId)) {
            state.viewingParticipantId = me ? me.id : (participants[0] ? participants[0].id : null);
          }

          state.loading = false;
          render();
        } catch (err) {
          console.error('Failed to open event:', err);
          state.loading = false;
          render();
          if (!silent) showToast('Ошибка загрузки события');
        }
      }

      function initRealtime() {
        const onChange = () => {
          clearTimeout(realtimeTimer);
          realtimeTimer = setTimeout(() => {
            if (state.screen === 'event' && state.activeEventId) {
              openEventById(state.activeEventId, true, false);
            } else if (state.screen === 'home') {
              fetchHomeEvents(true);
            }
          }, 250);
        };

        supabase
          .channel('porovnu-fintech-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, onChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'participants' }, onChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, onChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'paid_transfers' }, onChange)
          .subscribe(status => {
            state.realtimeLive = status === 'SUBSCRIBED';
            const dot = document.getElementById('liveSyncDot');
            if (dot) {
              dot.classList.toggle('connecting', !state.realtimeLive);
              dot.title = state.realtimeLive ? 'Синхронизация активна' : 'Подключение...';
            }
          });
      }

      /* ------------------------------------------------------------------------
         7. FORMATTING & HELPER UTILITIES
         ------------------------------------------------------------------------ */
      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDotDate(isoDate) {
        if (!isoDate) return '';
        const parts = String(isoDate).split('-');
        if (parts.length !== 3) return isoDate;
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
      }

      function todayISO() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function pluralParticipants(count) {
        const n = Math.abs(count) % 100;
        const n1 = n % 10;
        if (n > 10 && n < 20) return `${count} участников`;
        if (n1 > 1 && n1 < 5) return `${count} участника`;
        if (n1 === 1) return `${count} участник`;
        return `${count} участников`;
      }

      function getCategorySvg(key) {
        const found = CATEGORY_ICONS.find(item => item.key === key);
        return found ? found.svg : CATEGORY_ICONS[0].svg;
      }

      function getInviteUrl(eventId) {
        return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=${eventId}`;
      }

      function shareInviteToTelegram(ev) {
        const url = getInviteUrl(ev.id);
        const text = `Присоединяйтесь к событию «${ev.title}» (${formatDotDate(ev.event_date)}) в ПОРОВНУ — добавляйте расходы и смотрите расчёт переводов.`;
        const shareLink = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;

        if (tg && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink(shareLink);
        } else {
          copyText(url, 'Ссылка скопирована. Открываем Telegram...');
          window.open(shareLink, '_blank', 'noopener');
        }
      }

      function copyText(text, toastMessage) {
        let ok = false;
        try {
          const el = document.createElement('textarea');
          el.value = text;
          el.setAttribute('readonly', '');
          el.style.position = 'fixed';
          el.style.top = '-9999px';
          document.body.appendChild(el);
          el.select();
          el.setSelectionRange(0, el.value.length);
          ok = document.execCommand('copy');
          document.body.removeChild(el);
        } catch (e) {
          ok = false;
        }

        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(toastMessage))
            .catch(() => showToast('Не удалось скопировать'));
          return;
        }
        showToast(ok ? toastMessage : 'Не удалось скопировать');
      }

      function showToast(msg) {
        const host = document.getElementById('toastHost');
        const pill = document.createElement('div');
        pill.className = 'toast-pill';
        pill.textContent = msg;
        host.appendChild(pill);
        setTimeout(() => {
          pill.style.opacity = '0';
          pill.style.transform = 'translateY(-6px)';
          pill.style.transition = 'opacity 0.18s, transform 0.18s';
          setTimeout(() => pill.remove(), 200);
        }, 2300);
      }

      /* ------------------------------------------------------------------------
         8. MASTER RENDER CONTROLLER
         ------------------------------------------------------------------------ */
      function render() {
        document.documentElement.setAttribute('data-theme', state.theme);

        const topBar = document.getElementById('topBar');
        const viewport = document.getElementById('mainViewport');
        const dock = document.getElementById('bottomDock');

        if (state.screen === 'home' || !state.activeEvent) {
          topBar.innerHTML = renderHomeTopBar();
          viewport.classList.add('with-bottom-cta');

          if (state.loading) {
            viewport.innerHTML = `<div class="loader-wrap"><div class="spinner"></div><span>Загрузка событий...</span></div>`;
          } else {
            viewport.innerHTML = renderHomeScreen();
          }

          dock.style.display = 'block';
          dock.innerHTML = `
            <button type="button" class="btn btn-primary btn-block" data-action="open-create-event">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Новое событие
            </button>
          `;
        } else {
          const ev = state.activeEvent;
          const ctx = resolveEventContext(ev);
          const fin = computeEventFinances(ev);

          topBar.innerHTML = renderEventTopBar(ev, ctx);
          dock.style.display = 'none';
          viewport.classList.remove('with-bottom-cta');

          if (state.loading) {
            viewport.innerHTML = `<div class="loader-wrap"><div class="spinner"></div><span>Синхронизация...</span></div>`;
          } else {
            viewport.innerHTML = renderEventScreen(ev, ctx, fin);
          }
        }
      }

      function renderThemeIconSvg() {
        return state.theme === 'dark'
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

                <line x1="5" y1="12" x2="19" y2="12"/>

            <div class="brand-title-wrap">
              <span class="brand-wordmark">ПОРОВНУ</span>
              <span id="liveSyncDot" class="sync-dot ${state.realtimeLive ? '' : 'connecting'}" title="${state.realtimeLive ? 'Синхронизация активна' : 'Подключение...'}"></span>
            </div>

            <button type="button" class="user-chip" data-action="open-profile-modal" title="Профиль">

          </div>
        `;
      }

      function renderHomeScreen() {
        const enriched = state.events.map(ev => ({ ev, fin: computeEventFinances(ev) }));

        const countAll = enriched.length;
        const countActive = enriched.filter(x => !x.fin.isClosed).length;
        const countClosed = enriched.filter(x => x.fin.isClosed).length;

        const filtered = enriched
          .filter(x => {
            if (state.homeFilter === 'active') return !x.fin.isClosed;
            if (state.homeFilter === 'closed') return x.fin.isClosed;
            return true;
          })
          .sort((a, b) => String(b.ev.event_date || '').localeCompare(String(a.ev.event_date || '')));

        const headerHtml = `
          <div class="home-header-block">
            <h1 class="home-title">Мои события</h1>
            <p class="home-subtitle">Совместные поездки, ужины и общие бюджеты</p>
          </div>

          <div class="segmented cols-3" style="margin-bottom: 14px;" role="tablist">
            <button type="button" class="seg-tab ${state.homeFilter === 'all' ? 'active' : ''}" data-action="filter-home" data-filter="all">
              Все (${countAll})
            </button>
            <button type="button" class="seg-tab ${state.homeFilter === 'active' ? 'active' : ''}" data-action="filter-home" data-filter="active">
              Активные (${countActive})
            </button>
            <button type="button" class="seg-tab ${state.homeFilter === 'closed' ? 'active' : ''}" data-action="filter-home" data-filter="closed">
              Закрытые (${countClosed})
            </button>
          </div>
        `;

        if (filtered.length === 0) {
          const emptyTitle = countAll === 0 ? 'Нет созданных событий' : 'В этом разделе пусто';
          const emptyDesc = countAll === 0
            ? 'Создайте первое событие, добавьте расходы и отправьте ссылку участникам.'
            : 'События с выбранным статусом отсутствуют.';

          return headerHtml + `
            <div class="card empty-box">
              <div class="empty-box-title">${emptyTitle}</div>
              <p class="empty-box-desc">${emptyDesc}</p>
            </div>
          `;
        }

        const listHtml = filtered.map(({ ev, fin }) => {
          const myP = fin.participants.find(
            p => p.tg_user_id !== null && String(p.tg_user_id) === String(state.user.id)
          );
          const myNet = myP && fin.ledger[myP.id] ? fin.ledger[myP.id].netKop : 0;

          let balanceNote = `Переводов: ${fin.paidCount} из ${fin.transfers.length}`;
          if (fin.totalBudgetKop === 0) {
            balanceNote = 'Расходы ещё не добавлены';
          } else if (myNet > 0) {
            balanceNote = `Вам должны <strong class="mono-num" style="color: var(--emerald);">${formatRubles(myNet)}</strong>`;
          } else if (myNet < 0) {
            balanceNote = `Вы должны <strong class="mono-num" style="color: var(--crimson);">${formatRubles(Math.abs(myNet))}</strong>`;
          } else if (fin.isClosed) {
            balanceNote = 'Все расчёты завершены';
          }

          return `
            <div class="card event-list-card" data-action="open-event" data-event-id="${esc(ev.id)}">
              <div class="event-list-top">
                <div class="cat-badge">${getCategorySvg(ev.emoji)}</div>
                <div class="event-list-main">
                  <h2 class="event-list-title">${esc(ev.title)}</h2>
                  <div class="event-list-meta">
                    ${esc(formatDotDate(ev.event_date))} · ${pluralParticipants(fin.participants.length)}
                  </div>
                </div>
                <div class="event-list-right">
                  <div class="event-list-amount mono-num">${formatRubles(fin.totalBudgetKop)}</div>
                  <div class="status-tag ${fin.isClosed ? 'closed' : 'active'}">
                    ${fin.isClosed ? 'Закрыто' : 'Активно'}
                  </div>
                </div>
              </div>
              <div class="event-list-footer">
                <span>${balanceNote}</span>
                <span style="font-weight: 600; color: var(--text-primary);">Открыть →</span>
              </div>
            </div>
          `;
        }).join('');

        return headerHtml + listHtml;
      }

         ------------------------------------------------------------------------ */

      /* ------------------------------------------------------------------------

            <div class="kpi-card">

        }

        const itemsHtml = ev.expenses.slice().reverse().map(exp => {
          const payer = fin.participants.find(p => p.id === exp.paid_by);
          const amountKop = Math.round(Number(exp.amount || 0) * 100);
          const isCustom = exp.split_mode === 'custom' || exp.split_mode === 'manual';
          const splits = exp.splits && typeof exp.splits === 'object' ? exp.splits : {};

          const includedCount = fin.participants.filter(p => Math.round(Number(splits[p.id] || 0) * 100) > 0).length;
          const viewedShareKop = vp ? Math.round(Number(splits[vp.id] || 0) * 100) : 0;

          let badgeText = `Поровну · ${includedCount} чел.`;
          if (isCustom) {
            badgeText = 'Вручную';

                <div class="expense-name">${esc(exp.title)}</div>
                <div class="expense-sub-row">
                  <span>Оплатил: <strong style="font-weight: 600; color: var(--text-primary);">${payer ? esc(payer.name) : '—'}</strong></span>
                  <span class="split-tag">${badgeText}</span>
                </div>
              </div>
              <div class="expense-right">
                <div class="expense-sum mono-num">${formatRubles(amountKop)}</div>
                <div class="expense-share-note mono-num">
                  ${viewedShareKop > 0 ? `Доля: ${formatRubles(viewedShareKop)}` : 'Не участвует'}
                </div>
              </div>
            </div>
          `;
        }).join('');

        return kpiHtml + `
          <div class="section-row">
            <span class="section-label">Список чеков</span>
            <span class="section-meta tabular">${ev.expenses.length} шт.</span>
          </div>

      /* ------------------------------------------------------------------------
         8D. TAB 2: "РАСЧЁТ" (SMART SETTLEMENT)
         ------------------------------------------------------------------------ */
      function renderStatusPill(isPaid) {
        if (isPaid) {
          return `
            <span class="status-pill paid">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Оплачено
            </span>
          `;
        }
        return `
          <span class="status-pill pending">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
            Ожидание оплаты
          </span>
        `;
      }

      function renderSettlementTab(ev, ctx, fin) {
        const vp = ctx.viewedParticipant;
        const isViewingOwnProfile = Boolean(ctx.myParticipant && vp && ctx.myParticipant.id === vp.id);

        const totalTr = fin.transfers.length;
        const pct = totalTr > 0
          ? Math.round((fin.paidCount / totalTr) * 100)
          : (fin.totalBudgetKop > 0 ? 100 : 0);

        // Top Progress Summary Card
        const progressCardHtml = `
          <div class="card">
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600;">
              <span>Закрыто ${fin.paidCount} из ${totalTr} переводов</span>
              <span class="mono-num" style="color: ${fin.isClosed ? 'var(--emerald)' : 'var(--text-secondary)'};">${pct}%</span>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width: ${pct}%;"></div>
            </div>
            <div class="tabular" style="font-size: 12px; color: var(--text-secondary);">
              Оплачено ${formatRubles(fin.paidTransferKop)} из ${formatRubles(fin.totalTransferKop)}
            </div>
          </div>
        `;

        // Section 1 (Top): Personal Calculation for activeParticipant
        let personalCardHtml = '';
        if (vp) {
          const entry = fin.ledger[vp.id] || { paidKop: 0, shareKop: 0, netKop: 0 };
          const outgoing = fin.transfers.filter(t => t.fromId === vp.id);
          const incoming = fin.transfers.filter(t => t.toId === vp.id);

          const sectionTitle = isViewingOwnProfile
            ? `Ваш расчёт · ${vp.name}`
            : `Расчёт для ${vp.name}`;

          let netLabel = 'Баланс';
          let netClass = '';
          let netValueStr = '0 ₽';
          if (entry.netKop > 0) {
            netLabel = 'В плюсе';
            netClass = 'pos';
            netValueStr = `+${formatRubles(entry.netKop)}`;
          } else if (entry.netKop < 0) {
            netLabel = 'К переводу';
            netClass = 'neg';
            netValueStr = formatRubles(Math.abs(entry.netKop));
          }

          const metricsHtml = `
            <div class="personal-metrics-grid">
              <div class="personal-metric-cell">
                <div class="personal-metric-label">Потратил</div>
                <div class="personal-metric-val mono-num">${formatRubles(entry.paidKop)}</div>
              </div>
              <div class="personal-metric-cell">
                <div class="personal-metric-label">Доля в расходах</div>
                <div class="personal-metric-val mono-num">${formatRubles(entry.shareKop)}</div>
              </div>
              <div class="personal-metric-cell">
                <div class="personal-metric-label">${netLabel}</div>
                <div class="personal-metric-val mono-num ${netClass}">${netValueStr}</div>
              </div>
            </div>
          `;

          let outgoingHtml = '';
          if (outgoing.length === 0) {
            let emptyMsg = isViewingOwnProfile
              ? 'Вам ничего переводить не нужно'
              : `${esc(vp.name)} ничего переводить не нужно`;

            if (entry.netKop > 0) {
              emptyMsg += isViewingOwnProfile
                ? ` — вам должны <span class="mono-num">${formatRubles(entry.netKop)}</span>`
                : ` — должны <span class="mono-num">${formatRubles(entry.netKop)}</span>`;
            }

            outgoingHtml = `<div class="no-debt-box">${emptyMsg}</div>`;
          } else {
            outgoingHtml += `<div class="settlement-sub-group-title">Кому перевести</div>`;
            outgoingHtml += outgoing.map(t => {
              const recipient = fin.participants.find(p => p.id === t.toId);
              if (!recipient) return '';
              const hasSbp = Boolean(recipient.phone);

              // Strict permission control: ONLY the actual sender viewing their own profile sees action buttons
              let actionAreaHtml = '';
              if (isViewingOwnProfile) {
                if (t.isPaid) {
                  actionAreaHtml = `
                    <div class="transfer-actions-row">
                      <span class="status-pill paid">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Оплачено ✓
                      </span>
                      <button type="button" class="text-cancel-btn" data-action="toggle-transfer" data-t-index="${t.index}">
                        Отменить
                      </button>
                    </div>
                  `;
                } else {
                  actionAreaHtml = `
                    <div class="transfer-actions-row" style="justify-content: flex-end;">
                      <button type="button" class="btn btn-sm btn-emerald" data-action="toggle-transfer" data-t-index="${t.index}">
                        Я перевёл
                      </button>
                    </div>
                  `;
                }
              } else {
                // Organizer inspecting another participant: strictly read-only status pill
                actionAreaHtml = `
                  <div class="transfer-actions-row" style="justify-content: flex-end;">
                    ${renderStatusPill(t.isPaid)}
                  </div>
                `;
              }

              return `
                <div class="transfer-row-box ${t.isPaid ? 'settled' : ''}">
                  <div class="transfer-row-top">
                    <span class="transfer-counterparty">Получатель: ${esc(recipient.name)}</span>
                    <span class="transfer-amt mono-num">${formatRubles(t.amountKop)}</span>
                  </div>

                  ${hasSbp ? `
                    <div class="sbp-strip">
                      <div class="sbp-left-meta">
                        ${recipient.bank ? `<span class="bank-pill">${esc(recipient.bank)}</span>` : ''}
                        <span class="sbp-phone-text mono-num">${esc(recipient.phone)}</span>
                      </div>
                      <button type="button" class="btn btn-secondary btn-xs" data-action="copy-sbp" data-phone="${esc(recipient.phone)}" data-bank="${esc(recipient.bank || 'СБП')}">
                        Скопировать
                      </button>
                    </div>
                  ` : `
                    <div class="sbp-strip">
                      <span class="sbp-info-text">Реквизиты СБП не указаны</span>
                      ${(ctx.isOrganizer || (ctx.myParticipant && ctx.myParticipant.id === recipient.id)) ? `
                        <button type="button" class="btn btn-secondary btn-xs" data-action="open-edit-participant" data-pid="${esc(recipient.id)}">
                          Указать
                        </button>
                      ` : ''}
                    </div>
                  `}

                  ${actionAreaHtml}
                </div>
              `;
            }).join('');
          }

          let incomingHtml = '';
          if (incoming.length > 0) {
            incomingHtml += `<div class="settlement-sub-group-title">Ожидаемые поступления</div>`;
            incomingHtml += incoming.map(t => {
              const sender = fin.participants.find(p => p.id === t.fromId);
              if (!sender) return '';
              return `
                <div class="transfer-row-box ${t.isPaid ? 'settled' : ''}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                  <div>
                    <div class="transfer-counterparty">От: ${esc(sender.name)}</div>
                    <div class="transfer-amt incoming mono-num" style="margin-top: 2px;">+${formatRubles(t.amountKop)}</div>
                  </div>
                  ${renderStatusPill(t.isPaid)}
                </div>
              `;
            }).join('');
          }

          personalCardHtml = `
            <div class="card settlement-hero-card">
              <div class="settlement-header">
                <span class="settlement-title">${esc(sectionTitle)}</span>
              </div>
              ${metricsHtml}
              ${outgoingHtml}
              ${incomingHtml}
            </div>
          `;
        }

        // Section 2 (Bottom): "Все переводы события" — strictly OTHER participants' transfers (NO duplication, NO buttons)
        const otherTransfers = vp
          ? fin.transfers.filter(t => t.fromId !== vp.id)
          : fin.transfers;

        const otherTransfersHtml = otherTransfers.length === 0
          ? `
            <div class="card empty-box" style="padding: 24px 16px;">
              <p class="empty-box-desc">Других переводов в событии нет</p>
            </div>
          `
          : otherTransfers.map(t => {
              const from = fin.participants.find(p => p.id === t.fromId);
              const to = fin.participants.find(p => p.id === t.toId);
              if (!from || !to) return '';
              return `
                <div class="card other-transfer-card ${t.isPaid ? 'settled' : ''}">
                  <div style="min-width: 0; flex: 1;">
                    <div class="other-transfer-route">
                      ${esc(from.name)} <span style="color: var(--text-tertiary);">→</span> ${esc(to.name)}
                    </div>
                    <div class="other-transfer-amount mono-num">
                      ${formatRubles(t.amountKop)}
                    </div>
                  </div>
                  ${renderStatusPill(t.isPaid)}
                </div>
              `;
            }).join('');

        const balancesTableHtml = `
          <div class="card" style="padding: 14px 16px;">
            <button type="button" data-action="toggle-balances" style="width: 100%; display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 600; color: var(--text-primary);">
              <span>Детализация балансов</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="transform: rotate(${state.balancesOpen ? '180deg' : '0deg'}); transition: transform 0.2s;">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            ${state.balancesOpen ? `
              <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                ${fin.balances.map(b => {
                  const color = b.netKop > 0 ? 'var(--emerald)' : (b.netKop < 0 ? 'var(--crimson)' : 'var(--text-secondary)');
                  return `
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: var(--surface-subtle);">
                      <div>
                        <div style="font-size: 13px; font-weight: 600;">${esc(b.participant.name)}</div>
                        <div class="tabular" style="font-size: 11.5px; color: var(--text-secondary); margin-top: 2px;">
                          Оплатил: ${formatRubles(b.paidKop)} · Доля: ${formatRubles(b.shareKop)}
                        </div>
                      </div>
                      <div class="mono-num" style="font-size: 13.5px; font-weight: 600; color: ${color};">
                        ${formatRubles(b.netKop, true)}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;

        return progressCardHtml + personalCardHtml + `
          <div class="section-row">
            <span class="section-label">Все переводы события</span>
            <span class="section-meta tabular">${otherTransfers.length} шт.</span>
          </div>
          ${otherTransfersHtml}
          ${balancesTableHtml}

          <button type="button" class="btn btn-primary btn-block" data-action="copy-chat-report" style="margin-top: 4px;">
            Скопировать сводку для чата
          </button>
        `;
      }

      /* ------------------------------------------------------------------------
         8E. TAB 3: "УЧАСТНИКИ"
         ------------------------------------------------------------------------ */
      function renderParticipantsTab(ev, ctx, fin) {
        const inviteCardHtml = `
          <div class="card">
            <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 4px;">

            <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.45;">

                </div>

      /* ------------------------------------------------------------------------
         9. MODALS, DRAWERS & SUPABASE MUTATIONS
         ------------------------------------------------------------------------ */
      function openModal(id) {
        document.getElementById(id).classList.add('open');
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove('open');
      }

      function confirmDialog({ title, message, confirmLabel = 'Подтвердить', isDanger = false, hideCancel = false, onConfirm }) {
        document.getElementById('confirmDialogTitle').textContent = title;
        document.getElementById('confirmDialogText').innerHTML = message;
        const footer = document.getElementById('confirmDialogFooter');
        footer.innerHTML = '';

        if (!hideCancel) {
          const cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.className = 'btn btn-secondary';
          cancel.style.flex = '1';
          cancel.textContent = 'Отмена';
          cancel.onclick = () => closeModal('confirmDialogModal');
          footer.appendChild(cancel);
        }

        const ok = document.createElement('button');
        ok.type = 'button';
        ok.className = `btn ${isDanger ? 'btn-crimson-soft' : 'btn-primary'}`;
        ok.style.flex = '1';
        ok.textContent = confirmLabel;
        ok.onclick = () => {
          closeModal('confirmDialogModal');
          if (typeof onConfirm === 'function') onConfirm();
        };
        footer.appendChild(ok);

        openModal('confirmDialogModal');
      }

      function renderIconPicker(containerId, activeKey, onPick) {
        const el = document.getElementById(containerId);
        el.innerHTML = CATEGORY_ICONS.map(item => `
          <button type="button" class="icon-pick-btn ${item.key === activeKey ? 'active' : ''}" data-icon-key="${item.key}" title="${esc(item.label)}">
            ${item.svg}
          </button>
        `).join('');
        el.querySelectorAll('.icon-pick-btn').forEach(btn => {
          btn.onclick = () => onPick(btn.dataset.iconKey);
        });
      }

      /* --- Modal 1: Create Event --- */
      function openCreateEventDrawer() {
        document.getElementById('evTitleInput').value = '';
        document.getElementById('evDateInput').value = todayISO();
        document.getElementById('evCreatorNameInput').value = state.user.fullName;
        document.getElementById('evCreatorPhoneInput').value = '';
        document.getElementById('evCreatorBankSelect').value = '';
        document.getElementById('evCreatorCustomBankInput').value = '';
        document.getElementById('creatorCustomBankWrap').style.display = 'none';
        document.getElementById('evFriendInput').value = '';

        createIconKey = '🌲';
        createFriendsList = [];

        const handlePick = key => {
          createIconKey = key;
          renderIconPicker('createIconGrid', createIconKey, handlePick);
        };
        renderIconPicker('createIconGrid', createIconKey, handlePick);
        renderFriendChips();
        openModal('createEventModal');
      }

      function renderFriendChips() {
        document.getElementById('evFriendsCounter').textContent = `${createFriendsList.length} добавлено`;
        const wrap = document.getElementById('evFriendsChipsList');
        wrap.innerHTML = createFriendsList.map((name, i) => `
          <span class="chip-item">
            <span>${esc(name)}</span>
            <button type="button" data-rm-friend="${i}" aria-label="Удалить" style="color: var(--text-tertiary); font-weight: 700;">×</button>
          </span>
        `).join('');
        wrap.querySelectorAll('[data-rm-friend]').forEach(btn => {
          btn.onclick = () => {
            createFriendsList.splice(parseInt(btn.dataset.rmFriend, 10), 1);
            renderFriendChips();
          };
        });
      }

      function pushFriendChipFromInput() {
        const input = document.getElementById('evFriendInput');
        const val = input.value.trim();
        if (!val) return;
        val.split(',').map(s => s.trim()).filter(Boolean).forEach(name => {
          if (!createFriendsList.includes(name)) createFriendsList.push(name);
        });
        input.value = '';
        renderFriendChips();
        input.focus();
      }

      async function createEventSubmit() {
        const title = document.getElementById('evTitleInput').value.trim();
        const eventDate = document.getElementById('evDateInput').value || todayISO();
        const creatorName = document.getElementById('evCreatorNameInput').value.trim() || state.user.fullName;
        const phone = document.getElementById('evCreatorPhoneInput').value.trim();
        const bankSel = document.getElementById('evCreatorBankSelect').value;
        const bank = bankSel === 'Другой'
          ? document.getElementById('evCreatorCustomBankInput').value.trim()
          : bankSel;

        const pending = document.getElementById('evFriendInput').value.trim();
        if (pending && !createFriendsList.includes(pending)) {
          createFriendsList.push(pending);
        }

        if (!title) {
          showToast('Укажите название события');
          document.getElementById('evTitleInput').focus();
          return;
        }

        const btn = document.getElementById('submitCreateEventBtn');
        btn.disabled = true;
        btn.textContent = 'Создание...';

        try {
          const { data: evRow, error: evErr } = await supabase
            .from('events')
            .insert({
              title,
              event_date: eventDate,
              emoji: createIconKey,
              creator_tg_id: state.user.id
            })
            .select()
            .single();

          if (evErr) throw evErr;

          const rows = [
            {
              event_id: evRow.id,
              tg_user_id: state.user.id,
              name: creatorName,
              phone,
              bank,
              is_organizer: true
            },
            ...createFriendsList.map(fname => ({
              event_id: evRow.id,
              tg_user_id: null,
              name: fname,
              phone: '',
              bank: '',
              is_organizer: false
            }))
          ];

          const { error: partErr } = await supabase.from('participants').insert(rows);
          if (partErr) throw partErr;

          rememberEventId(evRow.id);
          closeModal('createEventModal');
          showToast('Событие создано');
          state.eventTab = 'expenses';
          await openEventById(evRow.id, false, false);
        } catch (err) {
          console.error('Create event error:', err);
          showToast('Ошибка при создании события');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Создать событие';
        }
      }

      /* --- Modal 2: Edit & Delete Event (Organizer Only) --- */
      function openEditEventDrawer() {
        const ev = state.activeEvent;
        if (!ev) return;
        document.getElementById('editEvTitleInput').value = ev.title;
        document.getElementById('editEvDateInput').value = ev.event_date || todayISO();
        editIconKey = ev.emoji || '🌲';
        const handlePick = key => {
          editIconKey = key;
          renderIconPicker('editIconGrid', editIconKey, handlePick);
        };
        renderIconPicker('editIconGrid', editIconKey, handlePick);
        openModal('editEventModal');
      }

      async function saveEditEvent() {
        const ev = state.activeEvent;
        if (!ev) return;
        const title = document.getElementById('editEvTitleInput').value.trim();
        const eventDate = document.getElementById('editEvDateInput').value || ev.event_date;
        if (!title) {
          showToast('Введите название события');
          return;
        }

        const btn = document.getElementById('saveEditEventBtn');
        btn.disabled = true;
        try {
          const { error } = await supabase
            .from('events')
            .update({ title, event_date: eventDate, emoji: editIconKey })
            .eq('id', ev.id);

          if (error) throw error;
          closeModal('editEventModal');
          showToast('Изменения сохранены');
          await openEventById(ev.id, true, false);
        } catch (err) {
          console.error(err);
          showToast('Ошибка сохранения');
        } finally {
          btn.disabled = false;
        }
      }

      function promptDeleteCurrentEvent() {
        const ev = state.activeEvent;
        if (!ev) return;
        confirmDialog({
          title: 'Удалить событие?',
          message: `Событие «${esc(ev.title)}» и все связанные чеки будут удалены без возможности восстановления.`,
          confirmLabel: 'Удалить',
          isDanger: true,
          onConfirm: async () => {
            try {
              const { error } = await supabase.from('events').delete().eq('id', ev.id);
              if (error) throw error;
              forgetEventId(ev.id);
              state.screen = 'home';
              state.activeEventId = null;
              state.activeEvent = null;
              showToast('Событие удалено');
              await fetchHomeEvents(false);
            } catch (err) {
              console.error(err);
              showToast('Ошибка при удалении');
            }
          }
        });
      }

      /* --- Modal 3: Add / Edit Expense --- */
      function buildEqualSplits(totalKop, selectedIds) {
        const result = {};
        if (!selectedIds.length) return result;
        const base = Math.floor(totalKop / selectedIds.length);
        let rem = totalKop - base * selectedIds.length;
        selectedIds.forEach(pid => {
          const extra = rem > 0 ? 1 : 0;
          if (rem > 0) rem--;
          result[pid] = Number(((base + extra) / 100).toFixed(2));
        });

      function getCustomSplitsData() {
        const map = {};
        let sumKop = 0;
        let invalid = false;

        document.querySelectorAll('#customSplitRows .custom-split-input').forEach(inp => {
          const pid = inp.dataset.customPid;
          const kop = toKopecks(inp.value);
          if (Number.isNaN(kop)) {
            invalid = true;
            map[pid] = 0;
          } else {
            map[pid] = kop;
            sumKop += kop;
          }
        });

        return { map, sumKop, invalid };
      }

      function distributeRemainder() {
        const totalKop = toKopecks(document.getElementById('expAmountInput').value);
        if (Number.isNaN(totalKop) || totalKop <= 0) {
          showToast('Сначала укажите сумму чека');
          document.getElementById('expAmountInput').focus();
          return;
        }

        const inputs = Array.from(document.querySelectorAll('#customSplitRows .custom-split-input'));
        if (!inputs.length) return;

        let usedKop = 0;
        const zeroInputs = [];

        inputs.forEach(inp => {
          const kop = toKopecks(inp.value);
          if (!Number.isNaN(kop) && kop > 0) {
            usedKop += kop;
          } else {
            zeroInputs.push(inp);
          }
        });

        const targets = zeroInputs.length > 0 && usedKop < totalKop ? zeroInputs : inputs;
        const poolKop = targets === inputs ? totalKop : (totalKop - usedKop);

        if (poolKop <= 0) {
          showToast('Остаток уже равен 0 ₽');
          return;
        }

        const base = Math.floor(poolKop / targets.length);
        let rem = poolKop - base * targets.length;
        targets.forEach(inp => {
          const extra = rem > 0 ? 1 : 0;
          if (rem > 0) rem--;
          inp.value = fromKopecksInput(base + extra);
        });

        validateExpenseForm();
      }

      function validateExpenseForm() {
        const strip = document.getElementById('expValidationStrip');
        const saveBtn = document.getElementById('saveExpenseBtn');
        const totalKop = toKopecks(document.getElementById('expAmountInput').value);

        strip.className = 'validation-strip';

        if (Number.isNaN(totalKop) || totalKop <= 0) {
          strip.classList.add('warn');
          strip.innerHTML = `<span>Укажите сумму чека</span><span class="mono-num">0 ₽</span>`;
          saveBtn.disabled = true;
          return;
        }

        if (modalSplitMode === 'equal') {
          const selected = getCheckedEqualIds();
          if (selected.length === 0) {
            strip.classList.add('err');
            strip.innerHTML = `<span>Выберите хотя бы одного участника</span><span>0 чел.</span>`;
            saveBtn.disabled = true;
            return;
          }
          const perPersonKop = Math.round(totalKop / selected.length);
          strip.classList.add('ok');
          strip.innerHTML = `<span>По ${formatRubles(perPersonKop)} на человека</span><span class="tabular">${selected.length} чел.</span>`;
          saveBtn.disabled = false;
        } else {
          const { sumKop, invalid } = getCustomSplitsData();
          if (invalid) {
            strip.classList.add('err');
            strip.innerHTML = `<span>Проверьте корректность сумм</span><span>Ошибка</span>`;
            saveBtn.disabled = true;
            return;
          }

          if (sumKop < totalKop) {
            strip.classList.add('warn');
            strip.innerHTML = `<span>Осталось распределить: ${formatRubles(totalKop - sumKop)}</span><span class="mono-num">${formatRubles(sumKop)}</span>`;
            saveBtn.disabled = true;
          } else if (sumKop > totalKop) {
            strip.classList.add('err');
            strip.innerHTML = `<span>Превышение: ${formatRubles(sumKop - totalKop)}</span><span class="mono-num">${formatRubles(sumKop)}</span>`;
            saveBtn.disabled = true;
          } else {
            strip.classList.add('ok');
            strip.innerHTML = `<span>Сумма сходится</span><span class="mono-num">${formatRubles(totalKop)}</span>`;
            saveBtn.disabled = false;
          }
        }
      }

      async function saveExpense() {
        const ev = state.activeEvent;
        if (!ev) return;

        const editId = document.getElementById('expEditId').value;
        const title = document.getElementById('expTitleInput').value.trim();
        const totalKop = toKopecks(document.getElementById('expAmountInput').value);
        const paidBy = document.getElementById('expPayerSelect').value;

        if (!title) {
          showToast('Введите наименование расхода');
          document.getElementById('expTitleInput').focus();
          return;
        }
        if (Number.isNaN(totalKop) || totalKop <= 0) {
          showToast('Сумма должна быть больше 0 ₽');
          return;
        }

        let splits = {};
        let resolvedSplitMode = modalSplitMode;
        if (modalSplitMode === 'equal') {
          const selected = getCheckedEqualIds();
          if (!selected.length) return;
          splits = buildEqualSplits(totalKop, selected);
          resolvedSplitMode = selected.length < ev.participants.length ? 'selective' : 'equal';
        } else {
          const { map, sumKop, invalid } = getCustomSplitsData();
          if (invalid || sumKop !== totalKop) return;
          resolvedSplitMode = 'manual';
          Object.entries(map).forEach(([pid, kop]) => {
            splits[pid] = Number((kop / 100).toFixed(2));
          });
        }

        const btn = document.getElementById('saveExpenseBtn');
        btn.disabled = true;
        btn.textContent = 'Сохранение...';

        try {
          const payload = {
            event_id: ev.id,
            title,
            amount: Number((totalKop / 100).toFixed(2)),
            paid_by: paidBy,
            split_mode: resolvedSplitMode,
            splits
          };

          if (editId) {
            const { error } = await supabase.from('expenses').update(payload).eq('id', editId);
            if (error) throw error;
            showToast('Трата обновлена');
          } else {
            const { error } = await supabase.from('expenses').insert(payload);
            if (error) throw error;
            showToast('Трата добавлена');
          }

          closeModal('expenseModal');
          await openEventById(ev.id, true, false);
        } catch (err) {
          console.error(err);
          showToast('Ошибка при сохранении траты');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Сохранить трату';
        }
      }

      /* --- Copy Chat Summary --- */
      function copyChatReport() {
        const ev = state.activeEvent;
        if (!ev) return;
        const fin = computeEventFinances(ev);

        const lines = [
          `ПОРОВНУ — ${ev.title} (${formatDotDate(ev.event_date)})`,
          `Общий бюджет: ${formatRubles(fin.totalBudgetKop)} · Участников: ${fin.participants.length}`,
          ''
        ];

        if (fin.transfers.length === 0) {
          lines.push('Все участники полностью в расчёте.');
        } else {
          lines.push(`Итоговые переводы (закрыто ${fin.paidCount} из ${fin.transfers.length}):`);
          fin.transfers.forEach((t, i) => {
            const from = fin.participants.find(p => p.id === t.fromId);
            const to = fin.participants.find(p => p.id === t.toId);
            const status = t.isPaid ? '[Переведено]' : '[Ожидается]';
            const sbp = to && to.phone ? ` (${to.bank ? to.bank + ': ' : ''}${to.phone})` : '';
            lines.push(`${i + 1}. ${from.name} → ${to.name}: ${formatRubles(t.amountKop)}${sbp} ${status}`);
          });
        }

        lines.push('');
        lines.push(`Открыть событие: ${getInviteUrl(ev.id)}`);
        copyText(lines.join('\n'), 'Сводка скопирована для чата');
      }

        // Demo Profile Modal save
        document.getElementById('saveDemoUserBtn').addEventListener('click', () => {
          const val = document.getElementById('demoUserNameInput').value.trim();
          if (!val) {
            showToast('Введите имя');
            return;
          }
          const parts = val.split(/\s+/);
          state.user.fullName = val;
          state.user.firstName = parts[0];
          if (!state.user.isTelegram) {
            try {
              localStorage.setItem(LS_DEMO_USER, JSON.stringify({
                id: state.user.id,
                first_name: parts[0],
                last_name: parts.slice(1).join(' ')
              }));
            } catch (e) {}
          }
          closeModal('demoProfileModal');
          render();
          showToast('Имя обновлено');
        });

        // Global Modal Close & Escape key
        document.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
        });

        document.querySelectorAll('.modal-backdrop').forEach(overlay => {
          overlay.addEventListener('click', e => {
            if (e.target === overlay) closeModal(overlay.id);
          });
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
          }
        });

        // Telegram theme change listener
        if (tg && typeof tg.onEvent === 'function') {
          tg.onEvent('themeChanged', () => {
            if (tg.colorScheme === 'dark' || tg.colorScheme === 'light') {
              state.theme = tg.colorScheme;
              render();
            }
          });
        }
      }

      /* ------------------------------------------------------------------------
         11. BOOTSTRAP
         ------------------------------------------------------------------------ */
      async function init() {
        bindEvents();
        initRealtime();

        const startEventId = extractStartEventId();
        if (startEventId) {
          await openEventById(startEventId, false, true);
        } else {
          await fetchHomeEvents(false);
        }
      }

      init();
    })();
  </script>
</body>
</html>
