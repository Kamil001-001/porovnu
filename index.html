      }

      function renderEventsListScreen() {
        const enriched = state.events.map(ev => ({ ev, fin: computeEventFinances(ev) }));

        const totalAll = enriched.length;
        const totalActive = enriched.filter(x => !x.fin.isClosed).length;
        const totalClosed = enriched.filter(x => x.fin.isClosed).length;

        const filtered = enriched.filter(item => {
          if (state.eventFilter === 'active') return !item.fin.isClosed;
          if (state.eventFilter === 'closed') return item.fin.isClosed;
          return true;
        });

        filtered.sort((a, b) => String(b.ev.event_date || '').localeCompare(String(a.ev.event_date || '')));

        const filtersHtml = `
          <div class="filter-pills" role="tablist">
            <button class="filter-pill ${state.eventFilter === 'all' ? 'active' : ''}" data-action="set-filter" data-filter="all">
              Все (${totalAll})
            </button>
            <button class="filter-pill ${state.eventFilter === 'active' ? 'active' : ''}" data-action="set-filter" data-filter="active">
              Активные (${totalActive})
            </button>
            <button class="filter-pill ${state.eventFilter === 'closed' ? 'active' : ''}" data-action="set-filter" data-filter="closed">
              Закрытые (${totalClosed})
            </button>
          </div>
        `;

        let cardsHtml = '';
        if (filtered.length === 0) {
          const isCompletelyEmpty = totalAll === 0;
          const msg = isCompletelyEmpty
            ? 'Создай своё первое событие или запусти готовый демо-сценарий «Поездка на природу» в один клик.'
            : (state.eventFilter === 'closed'
              ? 'Пока нет полностью закрытых событий.'
              : 'Все события уже закрыты! Создай новое для следующей встречи.');

          cardsHtml = `
            <div class="card empty-state">
              <div class="empty-icon">📅</div>
              <div class="empty-title">${isCompletelyEmpty ? 'У вас пока нет событий' : 'В этом фильтре пусто'}</div>
              <div class="empty-desc">${msg}</div>
              ${isCompletelyEmpty ? `
                <button class="btn btn-soft-blue btn-block" data-action="create-demo-event" style="margin-top: 14px;">
                  🌲 Создать демо-событие
                </button>
              ` : ''}
            </div>
          `;
        } else {
          cardsHtml = filtered.map(({ ev, fin }) => {
            const totalTr = fin.transfers.length;
            const pct = totalTr > 0
              ? Math.round((fin.paidCount / totalTr) * 100)
              : (fin.totalBudgetKopecks > 0 ? 100 : 0);

            // Personal balance status badge for current user
            const myParticipant = fin.participants.find(
              p => p.tg_user_id !== null && Number(p.tg_user_id) === Number(state.user.id)
            );

            let personalBadgeHtml = '';
            if (fin.totalBudgetKopecks === 0) {
              personalBadgeHtml = `<span class="status-pill status-pill-neutral">Нет трат</span>`;
            } else if (fin.isClosed) {
              personalBadgeHtml = `<span class="status-pill status-pill-closed">В расчёте ✅</span>`;
            } else if (myParticipant && fin.ledger[myParticipant.id]) {
              const netKop = fin.ledger[myParticipant.id].netKopecks;
              if (netKop > 0) {
                personalBadgeHtml = `<span class="status-pill status-pill-credit num">Вам должны ${formatKopecks(netKop)}</span>`;
              } else if (netKop < 0) {
                personalBadgeHtml = `<span class="status-pill status-pill-debt num">Вы должны ${formatKopecks(Math.abs(netKop))}</span>`;
              } else {
                personalBadgeHtml = `<span class="status-pill status-pill-closed">В расчёте ✅</span>`;
              }
            } else {
              personalBadgeHtml = `<span class="status-pill status-pill-neutral">Участников: ${fin.participants.length}</span>`;
            }

            const progressText = totalTr > 0
              ? `Закрыто ${fin.paidCount} из ${totalTr} переводов`
              : (fin.totalBudgetKopecks > 0 ? 'Переводы не требуются' : 'Добавьте первую трату');

            return `
              <div class="card event-card ${fin.isClosed ? 'is-closed' : ''}" data-action="open-event" data-event-id="${escapeHtml(ev.id)}">
                <div class="event-card-top">
                  <div class="event-emoji-box">${escapeHtml(ev.emoji || '🧾')}</div>
                  <div class="event-card-info">
                    <div class="event-card-title">${escapeHtml(ev.title)}</div>
                    <div class="event-card-meta">
                      <span>📅 ${escapeHtml(formatRuDate(ev.event_date))}</span>
                      <span>·</span>
                      <span>👥 ${fin.participants.length} чел.</span>
                    </div>
                  </div>
                  <div class="event-card-total-col">
                    <div class="event-card-total num">${formatKopecks(fin.totalBudgetKopecks)}</div>
                    <div class="event-card-open">Открыть →</div>
                  </div>
                </div>

                <div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width: ${pct}%;"></div>
                  </div>
                  <div class="event-card-bottom">
                    <span class="event-progress-label">${progressText}</span>
                    ${personalBadgeHtml}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }

        const footerHtml = totalAll > 0 ? `
          <div class="events-footer">
            <button class="btn btn-secondary btn-sm" data-action="create-demo-event">
              🌲 Создать демо-событие
            </button>
          </div>
        ` : '';

        return filtersHtml + cardsHtml + footerHtml;
      }

      /* ------------------------------------------------------------------------
         7B. EVENT DETAIL HEADER & PERSPECTIVE SWITCHER
         ------------------------------------------------------------------------ */
      function renderEventHeader(ev, finances) {
        const header = document.getElementById('appHeader');

        const viewerPillsHtml = finances.participants.map(p => {
          const isActive = p.id === state.viewerParticipantId;
          const isMe = p.tg_user_id !== null && Number(p.tg_user_id) === Number(state.user.id);
          return `
            <button type="button" class="viewer-pill ${isActive ? 'active' : ''}" data-global-action="select-viewer" data-uid="${escapeHtml(p.id)}">
              <span class="avatar avatar-xs" style="background: ${p.color};">${escapeHtml(getInitials(p.name))}</span>
              <span>${escapeHtml(p.name)}${isMe ? ' (вы)' : ''}</span>
            </button>
          `;
        }).join('');

        header.innerHTML = `
          <div class="event-nav-row">
            <button class="back-btn" data-global-action="go-events">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
              События
            </button>
            <div class="header-actions">
              <button class="header-share-btn" data-global-action="quick-share-event">
                ✈️ Поделиться
              </button>
              <button class="icon-btn" data-global-action="open-edit-event" title="Настройки события" aria-label="Настройки события">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </button>
              <button class="icon-btn" data-global-action="toggle-theme" title="Переключить тему" aria-label="Переключить тему">
                <span style="font-size: 14px; line-height: 1;">${state.theme === 'dark' ? '☀️' : '🌙'}</span>
              </button>
            </div>
          </div>

          <div class="event-identity-row">
            <button class="event-title-trigger" data-global-action="open-edit-event">
              <span class="event-header-emoji">${escapeHtml(ev.emoji || '🧾')}</span>
              <div class="event-header-meta">
                <div class="event-header-title">${escapeHtml(ev.title)}</div>
                <div class="event-header-date">${escapeHtml(formatRuDate(ev.event_date))} · ${finances.participants.length} уч.</div>
              </div>
            </button>
            <span id="realtimeDot" class="live-dot ${state.realtimeConnected ? '' : 'offline'}" title="${state.realtimeConnected ? 'Realtime подключен' : 'Подключение...'}"></span>
          </div>

          ${finances.participants.length > 0 ? `
            <div class="viewer-strip-wrap">
              <div class="viewer-strip-label">
                <span>👁️ Смотрю как:</span>
              </div>
              <div class="viewer-pills">${viewerPillsHtml}</div>
            </div>
          ` : ''}
        `;
      }

      function renderEventBottomNav(finances) {
        document.querySelectorAll('#bottomNav .nav-item').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
        });
        const unpaidCount = finances.transfers.length - finances.paidCount;
        const badge = document.getElementById('unpaidBadge');
        if (unpaidCount > 0) {
          badge.style.display = 'flex';
          badge.textContent = unpaidCount;
        } else {
          badge.style.display = 'none';
        }
      }

      /* ------------------------------------------------------------------------
         7C. EVENT TAB 1: "ТРАТЫ"
         ------------------------------------------------------------------------ */
      function renderExpensesTab(ev, finances) {
        const viewer = finances.participants.find(p => p.id === state.viewerParticipantId);
        const viewerEntry = viewer ? finances.ledger[viewer.id] : null;
        const shareKop = viewerEntry ? viewerEntry.shareKopecks : 0;
        const netKop = viewerEntry ? viewerEntry.netKopecks : 0;
        const balClass = netKop > 0 ? 'val-pos' : (netKop < 0 ? 'val-neg' : 'val-zero');

        const isUserLinked = finances.participants.some(
          p => p.tg_user_id !== null && Number(p.tg_user_id) === Number(state.user.id)
        );

        const unlinkedBanner = !isUserLinked ? `
          <div class="unlinked-banner">
            <span>Вы ещё не привязаны к участнику события</span>
            <button class="btn btn-primary btn-sm" data-action="open-join-modal">Войти</button>
          </div>
        ` : '';

        const heroHtml = `
          ${unlinkedBanner}
          <div class="card card-hero">
            <div class="hero-stats-grid">
              <div class="hero-stat-box">
                <span class="hero-stat-label">Всего потрачено</span>
                <span class="hero-stat-val num">${formatKopecks(finances.totalBudgetKopecks)}</span>
              </div>
              <div class="hero-stat-box">
                <span class="hero-stat-label">Ваша доля</span>
                <span class="hero-stat-val num">${formatKopecks(shareKop)}</span>
              </div>
              <div class="hero-stat-box highlight">
                <span class="hero-stat-label">Ваш баланс</span>
                <span class="hero-stat-val num ${balClass}">${formatKopecks(netKop, true)}</span>
              </div>
            </div>
            <div class="hero-bottom-strip">
              <span>🧾 Чеков: ${ev.expenses.length} · ${finances.isClosed ? 'Всё закрыто ✅' : `Закрыто ${finances.paidCount}/${finances.transfers.length}`}</span>
              <button style="color: #fff; font-weight: 800; font-size: 12px;" data-action="go-summary">К итогам →</button>
            </div>
          </div>

          <button class="btn btn-primary btn-block" data-action="open-add-expense" style="margin-bottom: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Добавить трату
          </button>
        `;

        if (ev.expenses.length === 0) {
          return heroHtml + `
            <div class="card empty-state">
              <div class="empty-icon">🧾</div>
              <div class="empty-title">В событии пока нет трат</div>
              <div class="empty-desc">Нажми «Добавить трату» выше, чтобы разделить чек поровну или указать суммы вручную.</div>
            </div>
          `;
        }

        const expensesHtml = ev.expenses.slice().reverse().map(exp => {
          const payer = finances.participants.find(p => p.id === exp.paid_by);
          const amountKop = Math.round(Number(exp.amount || 0) * 100);
          const isManual = exp.split_mode === 'manual';
          const splitsObj = exp.splits && typeof exp.splits === 'object' ? exp.splits : {};

          const activeShares = finances.participants
            .map(p => ({ p, kop: Math.round(Number(splitsObj[p.id] || 0) * 100) }))
            .filter(item => item.kop > 0);

          const viewerShareKop = viewer ? Math.round(Number(splitsObj[viewer.id] || 0) * 100) : 0;

          let badgeHtml = '';
          let breakdownHtml = '';

          if (isManual) {
            badgeHtml = `<span class="split-badge split-badge-manual">✏️ Вручную · ${activeShares.length} чел.</span>`;
            breakdownHtml = `
              <div class="manual-chips-row">
                ${activeShares.map(item => `
                  <span class="manual-share-chip num">
                    <span>${escapeHtml(item.p.name)}</span>
                    <span class="chip-amt">${formatKopecks(item.kop)}</span>
                  </span>
                `).join('')}
              </div>
            `;
          } else {
            const isAll = activeShares.length === finances.participants.length && finances.participants.length > 0;
            badgeHtml = isAll
              ? `<span class="split-badge split-badge-all">⚖️ Поровну · ${activeShares.length} чел.</span>`
              : `<span class="split-badge split-badge-selective">🎯 Поровну · ${activeShares.length} из ${finances.participants.length} чел.</span>`;

            if (!isAll && activeShares.length > 0) {
              breakdownHtml = `
                <div class="split-names-list">
                  Делят: ${activeShares.map(item => escapeHtml(item.p.name)).join(', ')}
                </div>
              `;
            }
          }

          return `
            <div class="card expense-card" data-action="edit-expense" data-id="${escapeHtml(exp.id)}">
              <div class="expense-top">
                <div class="cat-icon-box">${inferExpenseIcon(exp.title)}</div>
                <div class="expense-info">
                  <div class="expense-title">${escapeHtml(exp.title)}</div>
                  <div class="expense-payer">
                    ${payer ? `<span class="avatar avatar-xs" style="background: ${payer.color};">${escapeHtml(getInitials(payer.name))}</span>` : ''}
                    <span>Оплатил(а): <strong>${payer ? escapeHtml(payer.name) : '—'}</strong></span>
                  </div>
                </div>
                <div class="expense-amount-col">
                  <div class="expense-amount num">${formatKopecks(amountKop)}</div>
                  <div class="expense-viewer-share num ${viewerShareKop === 0 ? 'muted' : ''}">
                    ${viewerShareKop > 0 ? `Доля: ${formatKopecks(viewerShareKop)}` : 'Не участвует'}
                  </div>
                </div>
              </div>

              <div class="expense-bottom">
                ${badgeHtml}
                <div class="card-mini-actions">
                  <button class="mini-icon-action" data-action="edit-expense" data-id="${escapeHtml(exp.id)}" title="Редактировать" aria-label="Редактировать">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 20h9"/>
                      <path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                  </button>
                  <button class="mini-icon-action danger" data-action="delete-expense" data-id="${escapeHtml(exp.id)}" title="Удалить" aria-label="Удалить">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="3 6 5 6 21 6"/>
                      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                      <path d="M10 11v6"/><path d="M14 11v6"/>
                    </svg>
                  </button>
                </div>
                ${breakdownHtml}
              </div>
            </div>
          `;
        }).join('');

        return heroHtml + `
          <div class="section-header">
            <span class="section-title">Чеки события</span>
            <span class="section-count">${ev.expenses.length} шт.</span>
          </div>
          ${expensesHtml}
        `;
      }

      /* ------------------------------------------------------------------------
         7D. EVENT TAB 2: "ИТОГИ" (SMART SETTLEMENT & MINI-BILLS)
         ------------------------------------------------------------------------ */
      function renderSummaryTab(ev, finances) {
        const totalTr = finances.transfers.length;
        const pct = totalTr > 0
          ? Math.round((finances.paidCount / totalTr) * 100)
          : (finances.totalBudgetKopecks > 0 ? 100 : 0);
        const viewer = finances.participants.find(p => p.id === state.viewerParticipantId);

        const progressHtml = `
          <div class="card progress-card">
            <div class="progress-head">
              <span class="progress-title">Закрыто ${finances.paidCount} из ${totalTr} переводов</span>
              <span style="font-size: 13px; font-weight: 800; color: ${finances.isClosed ? 'var(--green-dark)' : 'var(--tg-blue)'};">
                ${finances.isClosed ? '100% ✅' : `${pct}%`}
              </span>
            </div>
            <div class="progress-track lg">
              <div class="progress-fill" style="width: ${pct}%;"></div>
            </div>
            <div class="progress-sub">
              <span>Оплачено по счетам:</span>
              <span class="num"><strong>${formatKopecks(finances.paidKopecks)}</strong> из ${formatKopecks(finances.totalTransferKopecks)}</span>
            </div>
          </div>
        `;

        // Personal Mini-Bill for Active Viewer
        let miniBillHtml = '';
        if (viewer) {
          const myOutgoing = finances.transfers.filter(t => t.fromId === viewer.id);
          const myIncoming = finances.transfers.filter(t => t.toId === viewer.id);

          let innerHtml = '';
          if (myOutgoing.length === 0 && myIncoming.length === 0) {
            innerHtml = `
              <div style="padding: 6px 2px; font-size: 14px; font-weight: 700; color: var(--green-dark);">
                В расчёте ✅
              </div>
              <div style="font-size: 12.5px; color: var(--text-secondary);">
                ${escapeHtml(viewer.name)}, никому ничего переводить не нужно.
              </div>
            `;
          } else {
            if (myOutgoing.length > 0) {
              innerHtml += `
                <div style="font-size: 12px; font-weight: 800; color: var(--red); margin-bottom: 6px;">
                  Кому перевести:
                </div>
                ${myOutgoing.map(t => renderMiniBillRow(finances, t, 'outgoing')).join('')}
              `;
            }
            if (myIncoming.length > 0) {
              innerHtml += `
                <div style="font-size: 12px; font-weight: 800; color: var(--green-dark); margin-top: ${myOutgoing.length ? '10px' : '0'}; margin-bottom: 6px;">
                  Кто переводит вам:
                </div>
                ${myIncoming.map(t => renderMiniBillRow(finances, t, 'incoming')).join('')}
              `;
            }
          }

          miniBillHtml = `
            <div class="card mini-bill-card">
              <div class="mini-bill-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="avatar avatar-md" style="background: ${viewer.color};">${escapeHtml(getInitials(viewer.name))}</span>
                  <div>
                    <div style="font-size: 15px; font-weight: 800;">Личный мини-счёт</div>
                    <div style="font-size: 11.5px; color: var(--text-secondary);">Участник: ${escapeHtml(viewer.name)}</div>
                  </div>
                </div>
                <span class="mini-bill-badge">Мини-счёт</span>
              </div>
              ${innerHtml}
            </div>
          `;
        }

        const transfersHtml = totalTr === 0
          ? `
            <div class="card empty-state">
              <div class="empty-icon">🤝</div>
              <div class="empty-title">Все участники в расчёте</div>
              <div class="empty-desc">Долгов в этом событии нет.</div>
            </div>
          `
          : finances.transfers.map(t => renderTransferCard(finances, t)).join('');

        const balancesHtml = `
          <div class="card">
            <button class="collapse-trigger" data-action="toggle-balances">
              <span>📊 Подробный баланс по людям</span>
              <svg class="collapse-chevron ${state.balancesExpanded ? 'open' : ''}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            ${state.balancesExpanded ? `
              <div class="balance-table">
                ${finances.balances.map(b => {
                  const cls = b.netKopecks > 0 ? 'val-pos' : (b.netKopecks < 0 ? 'val-neg' : 'val-zero');
                  return `
                    <div class="balance-row">
                      <div class="balance-person">
                        <span class="avatar avatar-md" style="background: ${b.participant.color};">${escapeHtml(getInitials(b.participant.name))}</span>
                        <div style="min-width: 0;">
                          <div style="font-size: 13.5px; font-weight: 700;">${escapeHtml(b.participant.name)}</div>
                          <div class="balance-person-meta num">
                            Потратил: ${formatKopecks(b.paidKopecks)} · Доля: ${formatKopecks(b.shareKopecks)}
                          </div>
                        </div>
                      </div>
                      <div class="balance-net num ${cls}">${formatKopecks(b.netKopecks, true)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;

        const copySummaryBtn = `
          <button class="btn btn-primary btn-block" data-action="copy-chat-summary" style="margin-top: 4px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Скопировать итоги для чата
          </button>
        `;

        return progressHtml + miniBillHtml + `
          <div class="section-header">
            <span class="section-title">Все переводы</span>
            <span class="section-count">Оптимизировано: ${totalTr}</span>
          </div>
          ${transfersHtml}
          ${balancesHtml}
          ${copySummaryBtn}
        `;
      }

      function renderMiniBillRow(finances, t, mode) {
        const from = finances.participants.find(p => p.id === t.fromId);
        const to = finances.participants.find(p => p.id === t.toId);
        if (!from || !to) return '';

        const paidTime = t.paidRow ? formatShortTime(t.paidRow.created_at) : '';

        if (mode === 'outgoing') {
          const hasSbp = Boolean(to.phone);
          return `
            <div class="mini-bill-item ${t.isPaid ? 'is-paid' : ''}">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 7px;">
                  <span class="avatar avatar-sm" style="background: ${to.color};">${escapeHtml(getInitials(to.name))}</span>
                  <span style="font-size: 13.5px; font-weight: 700;">Кому: ${escapeHtml(to.name)}</span>

        const creatorName = document.getElementById('newEventCreatorNameInput').value.trim() || state.user.name;

          return;

        const btn = document.getElementById('confirmCreateEventBtn');
        btn.disabled = true;

          const { data: evData, error: evErr } = await supabaseClient
            .from('events')
            .insert({
              title,
              event_date: eventDate,
              emoji: newEventEmoji,
              creator_tg_id: state.user.id
            })
            .select()
            .single();

          if (evErr) throw evErr;

          const participantRows = [
            {
              event_id: evData.id,
              tg_user_id: state.user.id,
              name: creatorName,
              phone: creatorPhone,
              bank: creatorBank,
              is_organizer: true

              phone: '',
              bank: '',
              is_organizer: false

          const { error: partErr } = await supabaseClient
            .from('participants')
            .insert(participantRows);

          if (partErr) throw partErr;

          closeModal('createEventModal');
          showToast(`Событие «${title}» создано 🎉`);
          await loadEventDetails(evData.id, false, false);

          showToast('Ошибка при создании события');

          btn.disabled = false;
          btn.textContent = 'Создать событие';
        }

      /* --- Modal 3: Add / Edit Expense (Equal & Manual Split) --- */
      function buildEqualSplitsMap(totalKop, selectedIds) {
        const splits = {};
        if (!selectedIds || selectedIds.length === 0) return splits;
        const base = Math.floor(totalKop / selectedIds.length);
        let rem = totalKop - base * selectedIds.length;
        selectedIds.forEach(uid => {
          const extra = rem > 0 ? 1 : 0;
          if (rem > 0) rem--;
          splits[uid] = Number(((base + extra) / 100).toFixed(2));
        });
        return splits;
      }

      function openExpenseModal(expenseId = null) {
        const ev = state.activeEvent;
        if (!ev || !ev.participants || ev.participants.length === 0) {
          showToast('Сначала добавьте участника в событие');
          return;
        }

        const finances = computeEventFinances(ev);
        const editing = expenseId ? ev.expenses.find(e => e.id === expenseId) : null;

        document.getElementById('expenseModalTitle').textContent = editing ? 'Редактировать трату' : 'Новая трата';
        document.getElementById('expIdInput').value = editing ? editing.id : '';
        document.getElementById('expTitleInput').value = editing ? editing.title : '';
        document.getElementById('expAmountInput').value = editing ? Number(editing.amount) : '';

        const delBtn = document.getElementById('deleteExpenseInModalBtn');
        delBtn.style.display = editing ? 'inline-flex' : 'none';

        renderQuickExpenseTags();

        const payerSelect = document.getElementById('expPayerSelect');
        const defaultPayer = editing ? editing.paid_by : state.viewerParticipantId;
        payerSelect.innerHTML = finances.participants.map(p =>
          `<option value="${escapeHtml(p.id)}" ${p.id === defaultPayer ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
        ).join('');

        // Equal checklist pre-selection
        const splitsObj = editing && editing.splits ? editing.splits : {};
        const checkedIds = new Set(
          editing
            ? Object.entries(splitsObj).filter(([, val]) => Number(val) > 0).map(([uid]) => uid)
            : finances.participants.map(p => p.id)
        );
        if (checkedIds.size === 0) {
          finances.participants.forEach(p => checkedIds.add(p.id));
        }
        renderSplitChecklist(finances.participants, checkedIds);

        // Manual inputs pre-fill
        const initialShares = {};
        if (editing && editing.split_mode === 'manual') {
          finances.participants.forEach(p => {
            const val = Number(splitsObj[p.id] || 0);
            initialShares[p.id] = val > 0 ? val : '';

      function getManualSharesKopeksFromModal() {
        const map = {};
        let sumKop = 0;
        let hasInvalid = false;

        document.querySelectorAll('#manualSplitList .manual-amount-input').forEach(inp => {
          const uid = inp.dataset.manualUid;
          const kop = rublesToKopeks(inp.value);
          const row = inp.closest('.manual-row');

          if (Number.isNaN(kop)) {
            hasInvalid = true;
            map[uid] = 0;
            if (row) row.classList.remove('has-value');
          } else {
            map[uid] = kop;
            sumKop += kop;
            if (row) row.classList.toggle('has-value', kop > 0);
          }
        });

        return { map, sumKop, hasInvalid };
      }

      /**
       * Distributes the remaining unallocated amount equally across empty/zero participants
       * (or across everyone if none are empty or remainder <= 0).
       */
      function distributeRemainderEqually() {
        const totalKop = rublesToKopeks(document.getElementById('expAmountInput').value);
        if (Number.isNaN(totalKop) || totalKop <= 0) {
          showToast('Сначала укажите общую сумму чека');
          document.getElementById('expAmountInput').focus();
          return;
        }

        const inputs = Array.from(document.querySelectorAll('#manualSplitList .manual-amount-input'));
        if (inputs.length === 0) return;

        let allocatedKop = 0;
        const emptyInputs = [];

        inputs.forEach(inp => {
          const kop = rublesToKopeks(inp.value);
          if (!Number.isNaN(kop) && kop > 0) {
            allocatedKop += kop;
          } else {
            emptyInputs.push(inp);
          }
        });

        const targets = emptyInputs.length > 0 && allocatedKop < totalKop ? emptyInputs : inputs;
        const amountToSplit = targets === inputs ? totalKop : (totalKop - allocatedKop);

        if (amountToSplit <= 0) {
          showToast('Остаток уже равен 0 ₽');
          return;
        }

        const base = Math.floor(amountToSplit / targets.length);
        let rem = amountToSplit - base * targets.length;

        targets.forEach(inp => {
          const extra = rem > 0 ? 1 : 0;
          if (rem > 0) rem--;
          inp.value = kopeksToInputString(base + extra);
        });

        updateExpenseValidation();
      }

      function clearManualInputs() {
        document.querySelectorAll('#manualSplitList .manual-amount-input').forEach(inp => {
          inp.value = '';
        });
        updateExpenseValidation();
      }

      function updateExpenseValidation() {
        const bar = document.getElementById('expenseValidationBar');
        const saveBtn = document.getElementById('saveExpenseBtn');
        const totalKop = rublesToKopeks(document.getElementById('expAmountInput').value);

        bar.className = 'validation-bar';

        if (Number.isNaN(totalKop) || totalKop <= 0) {
          bar.classList.add('state-under');
          bar.innerHTML = `<span>Укажите сумму чека больше 0 ₽</span><span class="validation-sub">0 ₽</span>`;
          saveBtn.disabled = true;
          return;
        }

        if (currentSplitModeInModal === 'equal') {
          const selected = getSelectedSplitIdsFromModal();
          if (selected.length === 0) {
            bar.classList.add('state-over');
            bar.innerHTML = `<span>Выберите хотя бы 1 участника</span><span class="validation-sub">0 чел.</span>`;
            saveBtn.disabled = true;
            return;
          }
          const perKop = Math.round(totalKop / selected.length);
          bar.classList.add('state-ok');
          bar.innerHTML = `
            <span class="num">По <strong>${formatKopecks(perKop)}</strong> с человека</span>
            <span class="validation-sub">Выбрано ${selected.length} чел.</span>
          `;
          saveBtn.disabled = false;
        } else {
          const { sumKop, hasInvalid } = getManualSharesKopeksFromModal();

          if (hasInvalid) {
            bar.classList.add('state-over');
            bar.innerHTML = `<span>Суммы не могут быть отрицательными</span><span class="validation-sub">Ошибка</span>`;
            saveBtn.disabled = true;
            return;
          }

          if (sumKop < totalKop) {
            const diff = totalKop - sumKop;
            bar.classList.add('state-under');
            bar.innerHTML = `
              <span class="num">Осталось распределить: <strong>${formatKopecks(diff)}</strong></span>
              <span class="validation-sub num">${formatKopecks(sumKop)} / ${formatKopecks(totalKop)}</span>
            `;
            saveBtn.disabled = true;
          } else if (sumKop > totalKop) {
            const diff = sumKop - totalKop;
            bar.classList.add('state-over');
            bar.innerHTML = `
              <span class="num">Превышение на: <strong>${formatKopecks(diff)}</strong></span>
              <span class="validation-sub num">${formatKopecks(sumKop)} / ${formatKopecks(totalKop)}</span>
            `;
            saveBtn.disabled = true;
          } else {
            bar.classList.add('state-ok');
            bar.innerHTML = `
              <span>Сумма сходится ✅</span>
              <span class="validation-sub num">${formatKopecks(totalKop)}</span>
            `;
            saveBtn.disabled = false;
          }
        }
      }

      async function saveExpenseInSupabase() {
        const ev = state.activeEvent;
        if (!ev) return;

        const id = document.getElementById('expIdInput').value;
        const title = document.getElementById('expTitleInput').value.trim();
        const totalKop = rublesToKopeks(document.getElementById('expAmountInput').value);
        const paidBy = document.getElementById('expPayerSelect').value;

        if (!title) {
          showToast('Введите название траты');
          document.getElementById('expTitleInput').focus();
          return;
        }
        if (Number.isNaN(totalKop) || totalKop <= 0) {
          showToast('Укажите сумму больше 0 ₽');
          return;
        }

        let splits = {};
        if (currentSplitModeInModal === 'equal') {
          const selected = getSelectedSplitIdsFromModal();
          if (selected.length === 0) {
            showToast('Выберите хотя бы одного участника');
            return;
          }
          splits = buildEqualSplitsMap(totalKop, selected);
        } else {
          const { map, sumKop, hasInvalid } = getManualSharesKopeksFromModal();
          if (hasInvalid || sumKop !== totalKop) {
            showToast('Сумма долей должна точно сходиться с суммой чека');
            return;
          }
          Object.entries(map).forEach(([uid, kop]) => {
            splits[uid] = Number((kop / 100).toFixed(2));
          });
        }

        const saveBtn = document.getElementById('saveExpenseBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Сохраняем...';

        try {
          const payload = {
            event_id: ev.id,
            title,
            amount: Number((totalKop / 100).toFixed(2)),
            paid_by: paidBy,
            split_mode: currentSplitModeInModal,
            splits
          };

          if (id) {
            const { error } = await supabaseClient.from('expenses').update(payload).eq('id', id);
            if (error) throw error;
            showToast('Трата обновлена ✓');
          } else {
            const { error } = await supabaseClient.from('expenses').insert(payload);
            if (error) throw error;
            showToast('Трата добавлена ✓');
          }

          closeModal('expenseModal');
          await loadEventDetails(ev.id, true, false);
        } catch (err) {
          console.error('Error saving expense:', err);
          showToast('Ошибка сохранения траты');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Сохранить трату';
        }
      }

      function initEventListeners() {
        // Header & FAB Global Actions
        document.getElementById('appShell').addEventListener('click', e => {
          const globalBtn = e.target.closest('[data-global-action]');
          if (!globalBtn) return;
          const act = globalBtn.dataset.globalAction;

          if (act === 'toggle-theme') {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem(THEME_STORAGE_KEY, state.theme); } catch (err) {}
            renderAll();
          } else if (act === 'go-events') {
            state.view = 'events';
            state.activeEventId = null;
            state.activeEvent = null;
            loadEventsList(false);
            document.getElementById('mainContent').scrollTop = 0;
          } else if (act === 'open-create-event') {
            openCreateEventModal();
          } else if (act === 'open-edit-event') {
            openEditEventModal();
          } else if (act === 'quick-share-event') {
            if (state.activeEvent) shareEventToTelegram(state.activeEvent);
          } else if (act === 'select-viewer') {
            state.viewerParticipantId = globalBtn.dataset.uid;
            renderAll();
            const p = state.activeEvent && state.activeEvent.participants.find(x => x.id === state.viewerParticipantId);
            if (p) showToast(`Смотрим как: ${p.name}`);
          } else if (act === 'open-guest-profile') {
            document.getElementById('guestNameInput').value = state.user.name;
            document.getElementById('profileModeNote').textContent = state.user.isTelegram
              ? `Вы авторизованы через Telegram (ID: ${state.user.id}).`
              : `Вы открыли приложение в браузере (гостевой ID: ${state.user.id}). Укажите имя для отображения в событиях.`;
            openModal('guestProfileModal');
          }
        });

        // Save Guest / Display Name
        document.getElementById('saveGuestProfileBtn').addEventListener('click', () => {
          const val = document.getElementById('guestNameInput').value.trim();
          if (!val) {
            showToast('Введите имя');
            return;
          }
          state.user.name = val;
          if (!state.user.isTelegram) {
            try {
              localStorage.setItem(GUEST_USER_STORAGE_KEY, JSON.stringify({ id: state.user.id, name: val }));
            } catch (e) {}
          }
          closeModal('guestProfileModal');
          renderAll();
          showToast(`Имя обновлено: ${val}`);
        });

        // Bottom Navigation Tabs
        document.querySelectorAll('#bottomNav .nav-item').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.dataset.tab;
            renderAll();
            document.getElementById('mainContent').scrollTop = 0;
          });
        });

        // Delegated Actions in mainContent
        document.getElementById('mainContent').addEventListener('click', e => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === 'set-filter') {
            state.eventFilter = btn.dataset.filter;
            renderAll();
          } else if (action === 'open-event') {
            state.activeTab = 'expenses';
            loadEventDetails(btn.dataset.eventId, false, true);
            document.getElementById('mainContent').scrollTop = 0;
          } else if (action === 'create-demo-event') {
            createDemoEventInSupabase();
          } else if (action === 'open-join-modal') {
            if (state.activeEvent) openJoinEventModal(state.activeEvent);
          } else if (action === 'open-add-expense') {
            openExpenseModal(null);
          } else if (action === 'go-summary') {
            state.activeTab = 'summary';
            renderAll();
            document.getElementById('mainContent').scrollTop = 0;
          } else if (action === 'delete-expense') {
            e.stopPropagation();
            deleteExpenseById(btn.dataset.id);
          } else if (action === 'edit-expense') {
            openExpenseModal(btn.dataset.id);
          } else if (action === 'copy-sbp') {
            copyToClipboard(btn.dataset.phone, `Номер скопирован: ${btn.dataset.phone} (${btn.dataset.bank})`);
          } else if (action === 'toggle-paid') {
            togglePaidTransferInSupabase(parseInt(btn.dataset.trIdx, 10));
          } else if (action === 'toggle-balances') {
            state.balancesExpanded = !state.balancesExpanded;
            renderAll();
          } else if (action === 'copy-chat-summary') {
            copySummaryForTelegramChat();
          } else if (action === 'share-tg-chat') {
            if (state.activeEvent) shareEventToTelegram(state.activeEvent);
          } else if (action === 'copy-invite') {
            if (state.activeEvent) {
              copyToClipboard(getEventDeepLink(state.activeEvent.id), 'Инвайт-ссылка скопирована! 📋');
            }
          } else if (action === 'add-participant') {
            openParticipantModal(null);
          } else if (action === 'edit-participant') {
            openParticipantModal(btn.dataset.id);
          } else if (action === 'delete-participant') {
            handleDeleteParticipant(btn.dataset.id);
          }
        });

        // Create Event Modal listeners
        document.getElementById('addInitialFriendBtn').addEventListener('click', addInitialFriendFromInput);
        document.getElementById('newEventFriendInput').addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addInitialFriendFromInput();
          }
        });
        document.getElementById('confirmCreateEventBtn').addEventListener('click', createNewEventInSupabase);

        // Edit Event Modal listeners
        document.getElementById('saveEventSettingsBtn').addEventListener('click', saveEventSettingsInSupabase);
        document.getElementById('deleteCurrentEventBtn').addEventListener('click', () => {
          const ev = state.activeEvent;
          if (!ev) return;
          closeModal('editEventModal');
          showCustomConfirm({
            title: 'Удалить событие?',
            message: `Событие <strong>«${escapeHtml(ev.title)}»</strong> и все его чеки будут удалены из базы данных.`,
            confirmText: 'Удалить',
            danger: true,
            onConfirm: async () => {
              try {
                const { error } = await supabaseClient.from('events').delete().eq('id', ev.id);
                if (error) throw error;
                removeSavedEventId(ev.id);
                state.view = 'events';
                state.activeEventId = null;
                state.activeEvent = null;
                showToast('Событие удалено');
                await loadEventsList(false);
              } catch (err) {
                console.error(err);
                showToast('Ошибка удаления события');
              }
            }
          });
        });

        // Expense Modal listeners
        document.getElementById('quickExpenseTagsRow').addEventListener('click', e => {
          const chip = e.target.closest('.tag-chip');
          if (!chip) return;
          const inp = document.getElementById('expTitleInput');
          inp.value = chip.dataset.preset;
          inp.focus();
        });

        document.getElementById('expAmountInput').addEventListener('input', updateExpenseValidation);
        document.getElementById('modeEqualBtn').addEventListener('click', () => setExpenseSplitMode('equal'));
        document.getElementById('modeManualBtn').addEventListener('click', () => setExpenseSplitMode('manual'));

        document.getElementById('splitChecklist').addEventListener('click', e => {
          const item = e.target.closest('.check-person');
          if (!item) return;
          item.classList.toggle('checked');
          item.querySelector('.custom-checkbox').textContent = item.classList.contains('checked') ? '✓' : '';
          updateExpenseValidation();
        });

        document.getElementById('selectAllSplitBtn').addEventListener('click', () => {
          if (!state.activeEvent) return;
          const fin = computeEventFinances(state.activeEvent);
          renderSplitChecklist(fin.participants, new Set(fin.participants.map(p => p.id)));
          updateExpenseValidation();
        });

        document.getElementById('clearAllSplitBtn').addEventListener('click', () => {
          if (!state.activeEvent) return;
          const fin = computeEventFinances(state.activeEvent);
          renderSplitChecklist(fin.participants, new Set());
          updateExpenseValidation();
        });

        document.getElementById('manualSplitList').addEventListener('input', e => {
          if (e.target.classList.contains('manual-amount-input')) {
            updateExpenseValidation();
          }
        });

        document.getElementById('distributeRemainderBtn').addEventListener('click', distributeRemainderEqually);
        document.getElementById('clearManualBtn').addEventListener('click', clearManualInputs);
        document.getElementById('saveExpenseBtn').addEventListener('click', saveExpenseInSupabase);
        document.getElementById('deleteExpenseInModalBtn').addEventListener('click', () => {
          const id = document.getElementById('expIdInput').value;
          if (id) deleteExpenseById(id);
        });

        // Participant Modal listeners
        document.getElementById('partBankSelect').addEventListener('change', e => {
          document.getElementById('customBankGroup').style.display =
            e.target.value === '__custom__' ? 'block' : 'none';
        });
        document.getElementById('saveParticipantBtn').addEventListener('click', saveParticipantInSupabase);

        // Universal Modal Close handlers
        document.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
          overlay.addEventListener('click', e => {
            if (e.target === overlay) closeModal(overlay.id);
          });
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
          }
        });

        // Listen for Telegram theme changes dynamically
        if (tg && typeof tg.onEvent === 'function') {
          tg.onEvent('themeChanged', () => {
            state.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
            renderAll();
          });
        }
      }

      /* ------------------------------------------------------------------------
         10. APPLICATION BOOTSTRAP
         ------------------------------------------------------------------------ */
      async function bootstrap() {
        initEventListeners();
        setupSupabaseRealtime();

        const deepLinkEventId = extractDeepLinkEventId();
        if (deepLinkEventId) {
          await loadEventDetails(deepLinkEventId, false, true);
        } else {
          await loadEventsList(false);
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
