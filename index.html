<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ПОРОВНУ — Делим счета в Telegram</title>
  <!-- Official Telegram WebApp SDK & Supabase JS v2 -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & TELEGRAM ADAPTIVE THEMES (LIGHT / DARK)
       ========================================================================== */
    :root {
      --tg-blue: #2481cc;
      --tg-blue-hover: #1b6eb2;
      --tg-blue-soft: rgba(36, 129, 204, 0.12);
      --green: #22c55e;
      --green-dark: #15803d;
      --green-soft: rgba(34, 197, 94, 0.13);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --amber: #f59e0b;
      --amber-dark: #b45309;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --purple: #8b5cf6;
      --purple-soft: rgba(139, 92, 246, 0.14);

      /* Light Telegram Palette */
      --outer-bg: #e2eaf3;
      --bg: #f1f4f8;
      --surface: #ffffff;
      --surface-2: #f5f7fa;
      --surface-elevated: #ffffff;
      --text: #111827;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.15);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.12);
      --shadow-phone: 0 24px 64px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.07);
      --backdrop: rgba(15, 23, 42, 0.54);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --tg-blue: #3b9eff;
      --tg-blue-hover: #58adff;
      --tg-blue-soft: rgba(59, 158, 255, 0.16);
      --green: #34d399;
      --green-dark: #34d399;
      --green-soft: rgba(52, 211, 153, 0.15);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.16);
      --amber: #fbbf24;
      --amber-dark: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.16);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.17);

      /* Dark Telegram Palette */
      --outer-bg: #0b1118;
      --bg: #17212b;
      --surface: #212d3b;
      --surface-2: #1a2531;
      --surface-elevated: #273545;
      --text: #f3f6fa;
      --text-secondary: #98a9bc;
      --text-muted: #6c7f94;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.38);
      --shadow-phone: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.09);
      --backdrop: rgba(4, 9, 15, 0.74);
    }

    /* ==========================================================================
       2. BASE RESET & RESPONSIVE MOBILE-FIRST SHELL
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: var(--font);
      background: var(--outer-bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .viewport-wrapper {
      height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tma-shell {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.22s ease, color 0.22s ease;
    }

    @media (min-width: 520px) {
      .viewport-wrapper {
        padding: 16px;
      }
      .tma-shell {
        height: min(92dvh, 880px);
        border-radius: 28px;
        box-shadow: var(--shadow-phone);
      }
    }

    /* ==========================================================================
       3. APP HEADERS & LIVE STATUS INDICATOR
       ========================================================================== */
    .app-header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--tg-blue) 0%, #1562a6 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.3);
      flex-shrink: 0;
    }

    .brand-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
      display: inline-block;
      flex-shrink: 0;
    }

    .live-dot.offline {
      background: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
    }

    .brand-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .user-profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      max-width: 145px;
      transition: border-color 0.15s, background 0.15s;
    }

    .user-profile-pill:hover {
      border-color: var(--tg-blue);
      background: var(--tg-blue-soft);
    }

    .user-profile-pill span.u-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: transform 0.12s, background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Event Detail Header */
    .event-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px 5px 7px;
      border-radius: 10px;
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.12s;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .header-share-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      background: var(--tg-blue);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(36, 129, 204, 0.28);
    }

    .header-share-btn:active {
      transform: scale(0.95);
    }

    .event-identity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .event-title-trigger {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
      text-align: left;
      padding: 2px 0;
    }

    .event-header-emoji {
      font-size: 23px;
      line-height: 1;
      flex-shrink: 0;
    }

    .event-header-meta {
      min-width: 0;
      flex: 1;
    }

    .event-header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .event-header-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Horizontal "Смотрю как:" Perspective Switcher */
    .viewer-strip-wrap {
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .viewer-strip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .viewer-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .viewer-pills::-webkit-scrollbar {
      display: none;
    }

    .viewer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 5px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .viewer-pill.active {
      background: var(--tg-blue-soft);
      border-color: var(--tg-blue);
      color: var(--tg-blue);
    }

    /* ==========================================================================
       4. SCROLL VIEWPORT, CARDS, BUTTONS, AVATARS, LOADERS
       ========================================================================== */
    .app-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 14px 28px;
      scroll-behavior: smooth;
    }

    .app-content.with-fab-pad {
      padding-bottom: 92px;
    }

    .app-content::-webkit-scrollbar {
      width: 5px;
    }

    .app-content::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 99px;
    }

    .view-animate {
      animation: viewFade 0.18s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 2px 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
      transition: background 0.2s, border-color 0.2s, transform 0.12s;
    }

    .val-pos { color: var(--green-dark); }
    .val-neg { color: var(--red); }
    .val-zero { color: var(--text-secondary); }
    .num { font-variant-numeric: tabular-nums; }

    /* Avatars */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      flex-shrink: 0;
      user-select: none;
    }
    .avatar-xs { width: 21px; height: 21px; font-size: 9px; }
    .avatar-sm { width: 25px; height: 25px; font-size: 10.5px; }
    .avatar-md { width: 32px; height: 32px; font-size: 12px; }
    .avatar-lg { width: 40px; height: 40px; font-size: 14.5px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none !important;
    }

    .btn-primary {
      background: var(--tg-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.28);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--tg-blue-hover);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--tg-blue-soft);
      border-color: var(--tg-blue);
    }

    .btn-success {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.24);
    }

    .btn-soft-blue {
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
    }

    .btn-soft-green {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .btn-soft-red {
      background: var(--red-soft);
      color: var(--red);
    }

    .btn-sm {
      min-height: 34px;
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-block {
      width: 100%;
    }

    /* Spinner */
    .spinner-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--tg-blue-soft);
      border-top-color: var(--tg-blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================================================
       5. HOME SCREEN: "МОИ СОБЫТИЯ"
       ========================================================================== */
    .filter-pills {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 13px;
      gap: 3px;
      margin-bottom: 12px;
    }

    .filter-pill {
      flex: 1;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      transition: all 0.15s ease;
    }

    .filter-pill.active {
      background: var(--tg-blue);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(36, 129, 204, 0.28);
    }

    .event-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .event-card:hover {
      border-color: var(--tg-blue);
    }

    .event-card:active {
      transform: scale(0.985);
    }

    .event-card.is-closed {
      border-color: rgba(34, 197, 94, 0.3);
    }

    .event-card-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .event-emoji-box {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .event-card.is-closed .event-emoji-box {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.25);
    }

    .event-card-info {
      flex: 1;
      min-width: 0;
    }

    .event-card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      word-break: break-word;
    }

    .event-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .event-card-total-col {
      text-align: right;
      flex-shrink: 0;
    }

    .event-card-total {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .event-card-open {
      font-size: 11px;
      font-weight: 700;
      color: var(--tg-blue);
      margin-top: 3px;
    }

    .progress-track {
      height: 8px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-track.lg {
      height: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green) 0%, #10b981 100%);
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .event-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .event-progress-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .status-pill-debt {
      background: var(--red-soft);
      color: var(--red);
    }

    .status-pill-credit {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .status-pill-closed {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .status-pill-neutral {
      background: var(--surface-2);
      color: var(--text-secondary);
    }

    .events-footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .fab-wrap {
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      z-index: 15;
      pointer-events: none;
    }

    .fab-btn {
      pointer-events: auto;
      width: 100%;
      min-height: 48px;
      border-radius: 15px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(36, 129, 204, 0.36);
    }

    /* ==========================================================================
       6. EVENT DETAIL: TAB 1 ("ТРАТЫ")
       ========================================================================== */
    .unlinked-banner {
      background: var(--amber-soft);
      border: 1px solid rgba(245, 158, 11, 0.38);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--amber-dark);
    }

    .card-hero {
      background: linear-gradient(135deg, var(--tg-blue) 0%, #1762a3 100%);
      color: #ffffff;
      border: none;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    [data-theme="dark"] .card-hero {
      background: linear-gradient(135deg, #2478c5 0%, #144a82 100%);
    }

    .card-hero::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      top: -45px;
      right: -30px;
      pointer-events: none;
    }

    .hero-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .hero-stat-box {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hero-stat-box.highlight {
      background: rgba(255, 255, 255, 0.96);
      color: #111827;
    }

    [data-theme="dark"] .hero-stat-box.highlight {
      background: rgba(15, 23, 35, 0.85);
      color: #f3f6fa;
    }

    .hero-stat-label {
      font-size: 10.5px;
      font-weight: 600;
      opacity: 0.86;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-stat-box.highlight .hero-stat-label {
      color: var(--text-secondary);
      opacity: 1;
    }

    .hero-stat-val {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .hero-bottom-strip {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.94;
      position: relative;
      z-index: 1;
    }

    .expense-card {
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
    }

    .expense-card:hover {
      border-color: var(--tg-blue);
    }

    .expense-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .cat-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .expense-info {
      flex: 1;
      min-width: 0;
    }

    .expense-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .expense-payer {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .expense-amount-col {
      text-align: right;
      flex-shrink: 0;
    }

    .expense-amount {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .expense-viewer-share {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--tg-blue);
      margin-top: 2px;
      white-space: nowrap;
    }

    .expense-viewer-share.muted {
      color: var(--text-muted);
      font-weight: 600;
    }

    .expense-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
      flex-wrap: wrap;
    }

    .split-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 99px;
    }

    .split-badge-all {
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
    }

    .split-badge-selective {
      background: var(--amber-soft);
      color: var(--amber-dark);
    }

    .split-badge-manual {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .manual-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      width: 100%;
    }

    .manual-share-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .manual-share-chip span.chip-amt {
      color: var(--purple);
      font-weight: 800;
    }

    .split-names-list {
      font-size: 11.5px;
      color: var(--text-secondary);
      width: 100%;
      line-height: 1.35;
    }

    .card-mini-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }

    .mini-icon-action {
      width: 31px;
      height: 31px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      background: var(--surface-2);
      transition: background 0.15s, color 0.15s;
    }

    .mini-icon-action:hover {
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
    }

    .mini-icon-action.danger:hover {
      background: var(--red-soft);
      color: var(--red);
    }

    /* ==========================================================================
       7. EVENT DETAIL: TAB 2 ("ИТОГИ")
       ========================================================================== */
    .progress-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .progress-title {
      font-size: 13.5px;
      font-weight: 800;
    }

    .progress-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 4px;
    }

    .mini-bill-card {
      border: 1.5px solid var(--tg-blue);
      background: linear-gradient(180deg, var(--tg-blue-soft) 0%, var(--surface) 44%);
    }

    .mini-bill-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mini-bill-badge {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--tg-blue);
      background: var(--surface);
      padding: 4px 9px;
      border-radius: 99px;
      border: 1px solid var(--tg-blue-soft);
    }

    .mini-bill-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px;
      margin-top: 8px;
    }

    .mini-bill-item.is-paid {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .transfer-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transfer-card.is-paid {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.38);
    }

    .transfer-route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transfer-people {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }

    .person-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 700;
    }

    .arrow-badge {
      color: var(--text-muted);
      font-weight: 700;
    }

    .transfer-sum {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .transfer-card.is-paid .transfer-sum {
      color: var(--green-dark);
    }

    .sbp-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      flex-wrap: wrap;
    }

    .transfer-card.is-paid .sbp-box {
      background: var(--surface);
    }

    .sbp-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .sbp-bank-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bank-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 7px;
      white-space: nowrap;
    }

    .bank-tbank { background: #ffdd2d; color: #1f1f1f; }
    .bank-sber { background: #21a038; color: #ffffff; }
    .bank-alfa { background: #ef3124; color: #ffffff; }
    .bank-vtb { background: #002882; color: #ffffff; }
    .bank-ozon { background: #005bff; color: #ffffff; }
    .bank-raif { background: #fee600; color: #1f1f1f; }
    .bank-yandex { background: #6b21a8; color: #ffffff; }
    .bank-other { background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border-strong); }

    .sbp-phone {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .sbp-missing {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    .transfer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .paid-stamp {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green-dark);
    }

    .collapse-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .collapse-chevron {
      transition: transform 0.2s ease;
      color: var(--text-secondary);
    }

    .collapse-chevron.open {
      transform: rotate(180deg);
    }

    .balance-table {
      margin-top: 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .balance-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 9px 10px;
      background: var(--surface-2);
      border-radius: 12px;
      align-items: center;
    }

    .balance-person {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .balance-person-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .balance-net {
      font-size: 14px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    /* ==========================================================================
       8. EVENT DETAIL: TAB 3 ("УЧАСТНИКИ")
       ========================================================================== */
    .invite-card {
      background: linear-gradient(145deg, var(--surface) 0%, var(--tg-blue-soft) 100%);
      border: 1px solid rgba(36, 129, 204, 0.25);
    }

    .invite-link-box {
      margin: 10px 0 12px;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px dashed var(--tg-blue);
      border-radius: 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--tg-blue);
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .invite-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .participant-card {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .participant-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .participant-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .participant-info {
      min-width: 0;
      flex: 1;
    }

    .participant-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .participant-name {
      font-size: 15px;
      font-weight: 700;
    }

    .org-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
      text-transform: uppercase;
    }

    .tg-linked-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--purple-soft);
      color: var(--purple);
    }

    .participant-sbp-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .participant-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .p-metric-box {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .p-metric-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .p-metric-val {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* ==========================================================================
       9. BOTTOM NAVIGATION BAR
       ========================================================================== */
    .bottom-nav {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      z-index: 25;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }

    .nav-item.active {
      color: var(--tg-blue);
      background: var(--tg-blue-soft);
    }

    .nav-badge {
      position: absolute;
      top: 3px;
      right: calc(50% - 23px);
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--red);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       10. MODALS, BOTTOM SHEETS, MANUAL SPLIT EDITOR & INVITE JOIN MODAL
       ========================================================================== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: var(--backdrop);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(3px);
      animation: fadeIn 0.16s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-overlay.center-modal {
      align-items: center;
      padding: 16px;
    }

    .bottom-sheet {
      width: 100%;
      max-height: 94%;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.24);
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .center-dialog {
      width: 100%;
      max-width: 400px;
      max-height: 90%;
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      animation: popIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
    }

    .sheet-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
    }

    .sheet-footer {
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--tg-blue);
      background: var(--surface);
    }

    .amount-input-wrap {
      position: relative;
    }

    .amount-input-wrap .form-input {
      font-size: 20px;
      font-weight: 800;
      padding-right: 36px;
    }

    .currency-suffix {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Segmented Control */
    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      padding: 4px;
    }

    .seg-btn {
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-secondary);
      transition: all 0.16s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seg-btn.active {
      background: var(--tg-blue);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(36, 129, 204, 0.28);
    }

    /* Emoji Picker (8 emojis in 4x2 grid) */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .emoji-option {
      height: 42px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      font-size: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }

    .emoji-option.active {
      background: var(--tg-blue-soft);
      border-color: var(--tg-blue);
      transform: scale(1.04);
    }

    /* Initial Friends Chips */
    .add-member-row {
      display: flex;
      gap: 7px;
    }

    .member-chips-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .member-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 99px;
      background: var(--tg-blue-soft);
      color: var(--tg-blue);
      font-size: 12.5px;
      font-weight: 700;
    }

    .member-chip-remove {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(36, 129, 204, 0.2);
      color: var(--tg-blue);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Quick Title Suggestion Chips */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-chip {
      padding: 5px 9px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .tag-chip:hover, .tag-chip.active {
      background: var(--tg-blue-soft);
      border-color: var(--tg-blue);
      color: var(--tg-blue);
    }

    /* Equal Split Checklist */
    .split-quick-btns {
      display: flex;
      gap: 10px;
    }

    .text-link-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--tg-blue);
    }

    .checklist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .check-person {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .check-person.checked {
      background: var(--tg-blue-soft);
      border-color: var(--tg-blue);
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--surface);
      font-size: 12px;
      font-weight: 800;
    }

    .check-person.checked .custom-checkbox {
      background: var(--tg-blue);
      border-color: var(--tg-blue);
      color: #ffffff;
    }

    .check-person-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Manual Split Editor */
    .manual-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .manual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      transition: border-color 0.15s, background 0.15s;
    }

    .manual-row.has-value {
      border-color: rgba(139, 92, 246, 0.4);
      background: var(--purple-soft);
    }

    .manual-person-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .manual-person-name {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manual-input-wrap {
      position: relative;
      width: 118px;
      flex-shrink: 0;
    }

    .manual-amount-input {
      width: 100%;
      min-height: 36px;
      padding: 6px 26px 6px 10px;
      border-radius: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      font-size: 14.5px;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .manual-amount-input:focus {
      border-color: var(--tg-blue);
    }

    .manual-rub-suffix {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Validation Status Bar */
    .validation-bar {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
    }

    .validation-bar.state-ok {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--green-dark);
    }

    .validation-bar.state-under {
      background: var(--amber-soft);
      border-color: rgba(245, 158, 11, 0.45);
      color: var(--amber-dark);
    }

    .validation-bar.state-over {
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.45);
      color: var(--red);
    }

    .validation-sub {
      font-size: 11.5px;
      font-weight: 600;
      opacity: 0.85;
      white-space: nowrap;
    }

    /* Claim Slot Cards in Deep-Link Join Modal */
    .claim-slot-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      margin-bottom: 7px;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .claim-slot-btn:hover {
      border-color: var(--tg-blue);
      background: var(--tg-blue-soft);
    }

    /* ==========================================================================
       11. TOASTS, EMPTY STATES & KEYFRAMES
       ========================================================================== */
    .toast-container {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast {
      background: #111827;
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.26);
      max-width: 100%;
      text-align: center;
      animation: toastIn 0.2s ease;
    }

    [data-theme="dark"] .toast {
      background: #f3f6fa;
      color: #111827;
    }

    .empty-state {
      text-align: center;
      padding: 32px 18px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .empty-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .empty-desc {
      font-size: 13px;
      line-height: 1.45;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>

  <script>
    /**
     * ==========================================================================
     * ПОРОВНУ — Production Telegram Mini App (Telegram WebApp SDK + Supabase)

     */
    const SUPABASE_URL = 'https://kvqmjwtiamkbndqmkhrb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Tee5Ezn9SJLW-EZp3uf8BQ_cTev1CzF';
    const BOT_USERNAME = 'porovnu_rus_bot';
    const APP_SHORT_NAME = 'app';

    (function () {
      'use strict';

      /* ------------------------------------------------------------------------
         1. SUPABASE CLIENT & TELEGRAM WEBAPP SDK INITIALIZATION
         ------------------------------------------------------------------------ */
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

      const GUEST_USER_STORAGE_KEY = 'porovnu_guest_user_v1';
      const SAVED_EVENTS_STORAGE_KEY = 'porovnu_saved_events';
      const THEME_STORAGE_KEY = 'porovnu_theme_v1';

      const EVENT_EMOJIS = ['🌲', '🧖', '🍕', '✈️', '🎉', '🏕️', '🍻', '🚗'];

      const QUICK_EXPENSE_PRESETS = [
        { icon: '🥩', label: 'Мясо и продукты' },
        { icon: '🏡', label: 'Аренда дома' },
        { icon: '💨', label: 'Кальян и табак' },
        { icon: '🥃', label: 'Напитки' },
        { icon: '🧖', label: 'Баня и веники' },
        { icon: '🍽️', label: 'Ресторан' },
        { icon: '🚗', label: 'Такси и бензин' }
      ];

      const KNOWN_BANKS = ['Т-Банк', 'Сбер', 'Альфа', 'ВТБ', 'Райффайзен', 'Озон Банк', 'Яндекс Пэй'];

      const AVATAR_COLORS = [
        '#2481cc', '#10b981', '#ef4444', '#ec4899',
        '#8b5cf6', '#f59e0b', '#06b6d4', '#6366f1', '#14b8a6'
      ];

      const RU_MONTHS_SHORT = [
        'янв', 'фев', 'мар', 'апр', 'мая', 'июн',
        'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'
      ];

      // Initialize Telegram Mini App SDK
      if (tg) {
        try {
          tg.ready();
          tg.expand();
        } catch (err) {
          console.warn('Telegram WebApp init warning:', err);
        }
      }

      /* ------------------------------------------------------------------------
         2. USER IDENTITY & LOCAL STORAGE HELPERS
         ------------------------------------------------------------------------ */
      function resolveCurrentUser() {
        const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        if (tgUser && tgUser.id) {
          const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ').trim();
          return {
            id: Number(tgUser.id),
            name: fullName || tgUser.username || 'Участник',
            isTelegram: true
          };
        }

        // Browser fallback: persistent numeric guest ID + editable name
        try {
          const raw = localStorage.getItem(GUEST_USER_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.id) {
              return {
                id: Number(parsed.id),
                name: String(parsed.name || 'Алексей'),
                isTelegram: false
              };
            }
          }
        } catch (e) {}

        const generated = {
          id: 900000000 + Math.floor(Math.random() * 99999999),
          name: 'Алексей'
        };
        try {
          localStorage.setItem(GUEST_USER_STORAGE_KEY, JSON.stringify(generated));
        } catch (e) {}

        return { id: generated.id, name: generated.name, isTelegram: false };
      }

      function getSavedEventIds() {
        try {
          const raw = localStorage.getItem(SAVED_EVENTS_STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr.filter(Boolean) : [];
        } catch (e) {

      function resolveInitialTheme() {
        if (tg && tg.colorScheme) {

        try {
          const saved = localStorage.getItem(THEME_STORAGE_KEY);
          if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) {}
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function extractDeepLinkEventId() {
        // 1. Telegram start_param
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
          return String(tg.initDataUnsafe.start_param).trim();
        }
        // 2. URL query parameters (?startapp=... or ?event=...)
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get('startapp') || params.get('event');
        if (fromQuery) return fromQuery.trim();

        // 3. Telegram WebApp hash parameter (#tgWebAppStartParam=...)
        if (window.location.hash) {
          const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
          const fromHash = hashParams.get('tgWebAppStartParam') || hashParams.get('startapp');
          if (fromHash) return fromHash.trim();
        }
        return null;
      }

      /* ------------------------------------------------------------------------
         4. INTEGER-KOPEK FINANCIAL ENGINE & GREEDY SETTLEMENT
         ------------------------------------------------------------------------ */
      function rublesToKopeks(value) {
        const str = String(value ?? '').trim().replace(',', '.');
        if (str === '') return 0;
        const num = parseFloat(str);
        if (!Number.isFinite(num) || num < 0) return NaN;
        return Math.round(num * 100);
      }

      function kopeksToInputString(kopeks) {
        if (!kopeks || kopeks <= 0) return '';
        if (kopeks % 100 === 0) return String(kopeks / 100);
        return (kopeks / 100).toFixed(2).replace(/0$/, '');
      }

      /**
       * Enriches an event with deterministic avatar colors and calculates
       * exact integer-kopek balances, greedy transfers, and paid transfer matches.
       */
      function computeEventFinances(ev) {
        const participants = (ev.participants || []).map((p, idx) => ({
          ...p,
          color: AVATAR_COLORS[idx % AVATAR_COLORS.length]
        }));
        const expenses = ev.expenses || [];
        const paidTransfersRows = ev.paid_transfers || [];

        const totalBudgetKopecks = expenses.reduce(
          (sum, exp) => sum + Math.round(Number(exp.amount || 0) * 100),
          0
        );

        const ledger = {};
        participants.forEach(p => {
          ledger[p.id] = {
            participant: p,
            paidKopecks: 0,
            shareKopecks: 0,
            netKopecks: 0
          };
        });

        expenses.forEach(exp => {
          const amountKop = Math.round(Number(exp.amount || 0) * 100);
          if (amountKop <= 0) return;

          if (ledger[exp.paid_by]) {
            ledger[exp.paid_by].paidKopecks += amountKop;
          }

          const splitsObj = exp.splits && typeof exp.splits === 'object' ? exp.splits : {};
          const entries = Object.entries(splitsObj).filter(([uid]) => Boolean(ledger[uid]));

          if (entries.length > 0) {
            entries.forEach(([uid, rubVal]) => {
              const shareKop = Math.round(Number(rubVal || 0) * 100);
              if (shareKop > 0) {
                ledger[uid].shareKopecks += shareKop;
              }
            });
          } else if (participants.length > 0) {
            // Fallback equal split if splits JSONB was empty
            const base = Math.floor(amountKop / participants.length);
            let rem = amountKop - base * participants.length;
            participants.forEach(p => {
              const extra = rem > 0 ? 1 : 0;
              if (rem > 0) rem--;
              ledger[p.id].shareKopecks += base + extra;
            });
          }
        });

        const balances = participants.map(p => {
          const entry = ledger[p.id];
          entry.netKopecks = entry.paidKopecks - entry.shareKopecks;
          return entry;
        });

        const debtors = balances
          .filter(b => b.netKopecks < 0)
          .map(b => ({ id: b.participant.id, amount: Math.abs(b.netKopecks) }));

        const creditors = balances
          .filter(b => b.netKopecks > 0)
          .map(b => ({ id: b.participant.id, amount: b.netKopecks }));

        const transfers = [];

        // Pass 1: Exact 1-to-1 debt/credit matches
        for (let i = 0; i < debtors.length; i++) {
          if (debtors[i].amount === 0) continue;
          const exactIdx = creditors.findIndex(c => c.amount === debtors[i].amount);
          if (exactIdx !== -1) {
            const amt = debtors[i].amount;
            transfers.push({
              fromId: debtors[i].id,
              toId: creditors[exactIdx].id,
              amountKopecks: amt
            });
            debtors[i].amount = 0;
            creditors[exactIdx].amount = 0;
          }
        }

        // Pass 2: Greedy pairing (largest debtor -> largest creditor)
        while (true) {
          debtors.sort((a, b) => b.amount - a.amount);
          creditors.sort((a, b) => b.amount - a.amount);

          const topDebtor = debtors[0];
          const topCreditor = creditors[0];

          if (!topDebtor || !topCreditor || topDebtor.amount <= 0 || topCreditor.amount <= 0) {
            break;
          }

          const settled = Math.min(topDebtor.amount, topCreditor.amount);
          transfers.push({
            fromId: topDebtor.id,
            toId: topCreditor.id,
            amountKopecks: settled
          });

          topDebtor.amount -= settled;
          topCreditor.amount -= settled;
        }

        // Match calculated transfers against paid_transfers table rows
        const usedPaidRowIds = new Set();
        const enrichedTransfers = transfers.map((t, idx) => {
          const match = paidTransfersRows.find(row =>
            !usedPaidRowIds.has(row.id) &&
            row.from_participant_id === t.fromId &&
            row.to_participant_id === t.toId &&
            Math.round(Number(row.amount || 0) * 100) === t.amountKopecks
          );
          if (match) usedPaidRowIds.add(match.id);

          return {
            ...t,
            idx,
            paidRow: match || null,
            isPaid: Boolean(match)
          };
        });

        const paidList = enrichedTransfers.filter(t => t.isPaid);
        const paidCount = paidList.length;
        const totalTransferKopecks = enrichedTransfers.reduce((s, t) => s + t.amountKopecks, 0);
        const paidKopecks = paidList.reduce((s, t) => s + t.amountKopecks, 0);

        const isClosed = totalBudgetKopecks > 0 && (
          enrichedTransfers.length === 0 || paidCount === enrichedTransfers.length
        );

        return {
          participants,
          totalBudgetKopecks,
          ledger,
          balances,
          transfers: enrichedTransfers,
          totalTransferKopecks,
          paidCount,
          paidKopecks,
          isClosed
        };
      }

      /* ------------------------------------------------------------------------
         5. SUPABASE DATA LAYER & REALTIME SUBSCRIPTIONS
         ------------------------------------------------------------------------ */
      async function loadEventsList(silent = false) {
        if (!silent) {
          state.loading = true;
          renderAll();
        }

        try {
          const userId = state.user.id;
          const savedIds = getSavedEventIds();

          // Find events where user is creator OR participant
          const [createdRes, partRes] = await Promise.all([
            supabaseClient.from('events').select('id').eq('creator_tg_id', userId),
            supabaseClient.from('participants').select('event_id').eq('tg_user_id', userId)
          ]);

          const idSet = new Set(savedIds);
          (createdRes.data || []).forEach(r => idSet.add(r.id));
          (partRes.data || []).forEach(r => idSet.add(r.event_id));

          const eventIds = Array.from(idSet);
          if (eventIds.length === 0) {
            state.events = [];
            state.loading = false;
            renderAll();
            return;
          }

          const [eventsRes, allPartsRes, allExpRes, allPaidRes] = await Promise.all([
            supabaseClient.from('events').select('*').in('id', eventIds).order('created_at', { ascending: false }),
            supabaseClient.from('participants').select('*').in('event_id', eventIds).order('created_at', { ascending: true }),
            supabaseClient.from('expenses').select('*').in('event_id', eventIds).order('created_at', { ascending: true }),
            supabaseClient.from('paid_transfers').select('*').in('event_id', eventIds).order('created_at', { ascending: true })
          ]);

          if (eventsRes.error) throw eventsRes.error;

          const rawEvents = eventsRes.data || [];
          const partsByEvent = groupByEventId(allPartsRes.data || []);
          const expsByEvent = groupByEventId(allExpRes.data || []);
          const paidByEvent = groupByEventId(allPaidRes.data || []);

          state.events = rawEvents.map(ev => ({
            ...ev,
            participants: partsByEvent[ev.id] || [],
            expenses: expsByEvent[ev.id] || [],
            paid_transfers: paidByEvent[ev.id] || []
          }));
        } catch (err) {
          console.error('Error loading events list:', err);
          if (!silent) showToast('Ошибка загрузки событий из Supabase');
        } finally {
          state.loading = false;
          renderAll();
        }
      }

      async function loadEventDetails(eventId, silent = false, checkInviteJoin = false) {
        if (!silent) {
          state.loading = true;
          renderAll();
        }

        try {
          const [evRes, partsRes, expRes, paidRes] = await Promise.all([
            supabaseClient.from('events').select('*').eq('id', eventId).maybeSingle(),
            supabaseClient.from('participants').select('*').eq('event_id', eventId).order('created_at', { ascending: true }),
            supabaseClient.from('expenses').select('*').eq('event_id', eventId).order('created_at', { ascending: true }),
            supabaseClient.from('paid_transfers').select('*').eq('event_id', eventId).order('created_at', { ascending: true })
          ]);

          if (evRes.error) throw evRes.error;

          if (!evRes.data) {
            removeSavedEventId(eventId);
            state.view = 'events';
            state.activeEventId = null;
            state.activeEvent = null;
            showToast('Событие не найдено или было удалено');
            await loadEventsList(false);
            return;
          }

          addSavedEventId(eventId);

          const fullEvent = {
            ...evRes.data,
            participants: partsRes.data || [],
            expenses: expRes.data || [],
            paid_transfers: paidRes.data || []
          };

          state.activeEvent = fullEvent;
          state.activeEventId = fullEvent.id;
          state.view = 'event';

          // Automatically pick current user's participant record for "Смотрю как"
          const linkedMe = fullEvent.participants.find(
            p => p.tg_user_id !== null && Number(p.tg_user_id) === Number(state.user.id)
          );

          if (linkedMe) {
            state.viewerParticipantId = linkedMe.id;
          } else if (
            !state.viewerParticipantId ||
            !fullEvent.participants.some(p => p.id === state.viewerParticipantId)
          ) {
            state.viewerParticipantId = fullEvent.participants[0] ? fullEvent.participants[0].id : null;
          }

          state.loading = false;
          renderAll(!silent);

          // Deep-link invite check: if current user is not yet linked to any participant
          if (checkInviteJoin && !linkedMe && invitePromptDismissedForEvent !== fullEvent.id) {
            openJoinEventModal(fullEvent);
          }
        } catch (err) {
          console.error('Error loading event details:', err);
          state.loading = false;
          renderAll();
          if (!silent) showToast('Не удалось загрузить событие');
        }
      }

      function groupByEventId(rows) {
        const map = {};
        rows.forEach(r => {
          if (!map[r.event_id]) map[r.event_id] = [];
          map[r.event_id].push(r);
        });
        return map;
      }

      function setupSupabaseRealtime() {
        const handleDbChange = () => {
          clearTimeout(realtimeDebounceTimer);
          realtimeDebounceTimer = setTimeout(() => {
            if (state.view === 'event' && state.activeEventId) {
              loadEventDetails(state.activeEventId, true, false);
            } else if (state.view === 'events') {
              loadEventsList(true);
            }
          }, 260);
        };

        supabaseClient
          .channel('porovnu-live-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, handleDbChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'participants' }, handleDbChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, handleDbChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'paid_transfers' }, handleDbChange)
          .subscribe(status => {
            state.realtimeConnected = status === 'SUBSCRIBED';
            const dot = document.getElementById('realtimeDot');
            if (dot) {
              dot.classList.toggle('offline', !state.realtimeConnected);
              dot.title = state.realtimeConnected ? 'Realtime подключен' : 'Подключение...';
            }
          });
      }

      /* ------------------------------------------------------------------------
         6. UTILITY HELPERS (FORMATTING, ICONS, CLIPBOARD, DEEP LINKS)
         ------------------------------------------------------------------------ */
      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatKopecks(kopecks, showSign = false) {
        const isNeg = kopecks < 0;
        const abs = Math.abs(Math.round(kopecks));
        const rubles = Math.floor(abs / 100);
        const kop = abs % 100;
        const rubStr = rubles.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const full = kop === 0 ? `${rubStr} ₽` : `${rubStr},${kop.toString().padStart(2, '0')} ₽`;
        if (showSign) {
          if (kopecks > 0) return `+${full}`;
          if (kopecks < 0) return `-${full}`;
        } else if (isNeg) {
          return `-${full}`;
        }
        return full;
      }

      function formatRuDate(dateStr) {
        if (!dateStr) return 'Без даты';
        const parts = String(dateStr).split('-');
        if (parts.length !== 3) return dateStr;
        const year = parts[0];
        const monthIdx = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        if (isNaN(day) || monthIdx < 0 || monthIdx > 11) return dateStr;
        return `${day} ${RU_MONTHS_SHORT[monthIdx]} ${year}`;
      }

      function formatShortTime(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return '';
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function getTodayISO() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      }

      function getInitials(name) {
        const parts = String(name || '?').trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return parts[0].slice(0, 2).toUpperCase();
      }

      function inferExpenseIcon(title) {
        const t = String(title || '').toLowerCase();
        if (t.includes('дом') || t.includes('аренд') || t.includes('отель') || t.includes('жиль') || t.includes('квартир')) return '🏡';
        if (t.includes('мясо') || t.includes('шашлык') || t.includes('продукт') || t.includes('угл') || t.includes('еда')) return '🥩';
        if (t.includes('кальян') || t.includes('табак')) return '💨';
        if (t.includes('напит') || t.includes('виски') || t.includes('пив') || t.includes('вин') || t.includes('алко') || t.includes('лимонад') || t.includes('сок')) return '🥃';
        if (t.includes('бан') || t.includes('саун') || t.includes('веник')) return '🧖';
        if (t.includes('ресторан') || t.includes('кафе') || t.includes('пицц') || t.includes('хинкал') || t.includes('ужин')) return '🍽️';
        if (t.includes('такси') || t.includes('бенз') || t.includes('дорог') || t.includes('машин')) return '🚗';
        return '🧾';
      }

      function getBankBadgeClass(bankName) {
        const b = String(bankName || '').toLowerCase();
        if (b.includes('т-банк') || b.includes('тинькофф')) return 'bank-tbank';
        if (b.includes('сбер')) return 'bank-sber';
        if (b.includes('альфа')) return 'bank-alfa';
        if (b.includes('втб')) return 'bank-vtb';
        if (b.includes('озон') || b.includes('ozon')) return 'bank-ozon';
        if (b.includes('райфф')) return 'bank-raif';
        if (b.includes('яндекс')) return 'bank-yandex';
        return 'bank-other';
      }

      function getEventDeepLink(eventId) {
        return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=${eventId}`;
      }

      function shareEventToTelegram(ev) {
        const deepLink = getEventDeepLink(ev.id);
        const text = `${ev.emoji || '🧾'} Присоединяйся к событию «${ev.title}» (${formatRuDate(ev.date)}) в ПОРОВНУ — добавляй траты и смотри кому сколько перевести!`;
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(deepLink)}&text=${encodeURIComponent(text)}`;

        if (tg && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink(shareUrl);
        } else {
          copyToClipboard(deepLink, 'Ссылка скопирована! Открываем Telegram...');
          window.open(shareUrl, '_blank', 'noopener');
        }
      }

      function copyToClipboard(text, successMsg) {
        let copied = false;
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          copied = document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (err) {
          copied = false;
        }

        if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(successMsg))
            .catch(() => showToast('Не удалось скопировать'));
          return;
        }
        showToast(copied ? successMsg : 'Не удалось скопировать');
      }

      function showToast(message) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-8px)';
          toast.style.transition = 'opacity 0.2s, transform 0.2s';
          setTimeout(() => toast.remove(), 220);
        }, 2400);
      }
